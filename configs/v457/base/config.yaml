version: '4.5.7'
description: "v457 Reset: Legacy Assets (v451) + Clean Structure (v450)"

training:
  model_name: 'v457_base_legacy_assets'
  algorithm: 'sac'
  total_timesteps: 1000000  # Longer horizon
  
  environment:
    initial_balance: 1000000.0
    transaction_cost: 0.0005  # v451 value (0.05%) - Realistic fee
    max_position_size: 1.0
    timeframe: "1m"
    min_delta: 0.05 
    
    # Feature Configuration
    feature_config_path: "config/v457/features.yaml"
    
    # Reward Reset (PnL Focused) + Anti-Freeze (v455 Hybrid)
    # Note: These parameters are passed directly to compute_hft_reward via kwargs.
    # Keys must match arguments in ztb/trading/rewards/fast_intraday.py
    # SCALING NOTE: Environment divides Reward (JPY) by 100,000.
    # Values here are in RAW JPY.
    reward_settings:
      # --- v457 Anti-Freeze Logic ---
      hold_grace: 20            # Allow 20 steps free holding
      hold_ramp: 50.0           # 50 JPY/step. (Optimized from 200 to reduce churn)
      edge_penalty_rate: 1.0    # 1.0 * Shortfall JPY.
      min_edge_mult: 1.2
      vol_floor: 0.0005         # 0.05% of price
      vol_floor_penalty: 20000000.0 # 20M * 0.0005 = 10k JPY (-0.1 reward)
      
      # Unused but present in signature (legacy)
      alpha: 0.0
      beta: 0.0
      gamma: 0.0

    # Revived from v451: Realistic Execution Model
    # Explicitly modeled slippage prevents "Paper Profits" where algorithm assumes
    # it can fetch exact price in high volatility.
    execution_model:
      base_slippage: 0.0001
      atr_slippage_factor: 0.1
      base_latency_ms: 10.0
      latency_jitter_ms: 5.0
      
    # Revived from v450: Dynamic Thresholds
    # Prevents trading "Paralysis" in low vol, and "Recklessness" in high vol.
    dynamic_threshold_mode: "z_score"
    z_score_window: 50
    z_score_threshold: 3.0
    z_score_method: "mad"
    min_action_threshold: 0.001
      
  # SAC Hyperparameters (The v451 Magic Numbers)
  sac_hyperparameters:
    gamma: 0.80             # v451: Ultra-short horizon (HFT-like)
    ent_coef: 0.05          # v451: High exploration
    learning_rate: 5.0e-5   # v451: Conservative updates
    batch_size: 2048        # v451
    buffer_size: 200000     # v451
    learning_starts: 1000   
    tau: 0.005
    train_freq: 1
    gradient_steps: 1

logging:
  log_level: 'INFO'
  project: 'zaif-bot-v457'
