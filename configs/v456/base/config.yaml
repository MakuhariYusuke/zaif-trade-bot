version: '4.5.6'

training:
  model_name: 'v456_phase1_3_optimized'
  algorithm: 'sac'
  total_timesteps: 200000
  
  environment:
    initial_balance: 200000.0
    transaction_cost: 0.001  # 0.1%
    max_position_size: 1.0
    
    # ==========================================
    # Environment Configuration
    # ==========================================
    dynamic_threshold_mode: 'z_score'  # options: 'fixed' | 'volatility' | 'z_score'
    z_score_window: 50
    z_score_threshold: 3.0
    z_score_method: 'mad'  # 'std' | 'mad'
    min_action_threshold: 0.001
    max_action_threshold: 0.08
    
    # ==========================================
    # 報酬設定 - ztb/trading/environment/utils/config.py RewardSettings で処理される
    # ==========================================
    reward_settings:
      # === 基本設定 ===
      use_simple_reward: false
      reward_scale: 100.0
      trading_bonus: 0.01
      
      # === ポジション管理 ===
      balance_penalty: 0.1
      balance_penalty_tolerance: 0.05
      position_soft_cap: 0.5
      position_penalty_scale: 0.1
      position_penalty_exponent: 2.0
      
      # === リスク制御 ===
      volatility_window: 20
      volatility_penalty_scale: 0.01
      sharpe_bonus_scale: 0.01
      sortino_bonus_scale: 0.01
      calmar_bonus_scale: 0.005
      
      # === 利益ボーナス ===
      profit_weight: 1.0
      profit_bonus_multipliers: [1.0, 1.5, 2.0]  # [HOLD, BUY, SELL]
      
      # === リスク・一貫性 ===
      risk_weight: 0.5
      consistency_weight: 0.2
      
      # === トレード頻度制御 ===
      trade_frequency_penalty: 0.001
      trade_frequency_halflife: 100.0
      trade_cooldown_steps: 5
      trade_cooldown_penalty: 0.01
      max_consecutive_trades: 3
      consecutive_trade_penalty: 0.05
      
      # === インベントリ管理 ===
      inventory_window: 10
      inventory_penalty_scale: 0.01
      
      # === 報酬クリッピング ===
      reward_clip_value: 80.0
      reward_clip_min: -80.0
      reward_clip_max: 80.0
      
      # === Multi-Strategy設定 ===
      ultra_profit_multiplier: 2.0
      ultra_risk_multiplier: 0.5
      
      # === 非実現損失ペナルティ ===
      unrealized_loss_penalty_enabled: false
      unrealized_loss_penalty_base: 1.1
      unrealized_loss_penalty_max_steps: 10
      
      # === 非対称報酬スケーリング ===
      asymmetric_reward_scaling:
        long_position_reward_multiplier: 1.0
        short_position_reward_multiplier: 1.0
        long_position_penalty_multiplier: 1.0
        short_position_penalty_multiplier: 1.0
      
      # === 行動最適化 (BehavioralPenaltyCalculator用) ===
      consistency_lookback: 50
      skewness_lookback: 10
      action_entropy_lookback: 10
      consistency_min_actions: 2
      action_balance_target: 0.333  # 3アクション均等目標
      entropy_regularization: 0.01
      action_smoothing: 0.1
      consistency_penalty: 0.05
      redundant_trade_penalty: 5.0
      
      # === カリキュラム学習 ===
      curriculum_stage: 'balanced'  # options: 'simple', 'balanced', 'advanced'
      enable_forced_diversity: false
      
      # === 有効化フラグ ===
      enable_inactivity_penalty: true
      enable_opportunity_cost: true
      enable_trade_execution_bonus: true
  
  # ==========================================
  # SAC Hyperparameters
  # ==========================================
  sac_hyperparameters:
    learning_rate: 0.0003
    buffer_size: 10000
    learning_starts: 100
    batch_size: 256
    ent_coef: 'auto'
    gamma: 0.99  # 割引率
    tau: 0.005  # ソフトアップデート係数
    target_update_interval: 1
    train_freq: 1

# ==========================================
# Evaluation Configuration (Walk-Forward)
# ==========================================
evaluation:
  checkpoint_dir: 'checkpoints/v456'
  compress: 'zstd'
  
  # 並列化・キャッシング設定 (Phase 2-3対応)
  parallel:
    enabled: true
    num_workers: 8
    enable_caching: true
    cache_max_items: 1000
    cache_ttl_seconds: 3600
  
  walk_forward:
    window_type: 'expanding'
    train_size_ratio: 0.5
    validation_size_ratio: 0.25
    test_size_ratio: 0.25

# ==========================================
# Logging Configuration
# ==========================================
logging:
  log_level: 'INFO'
  tensorboard:
    enabled: true
    log_dir: 'logs/v456'
    log_freq: 1000

# ==========================================
# Pipeline Configuration (推論パイプライン)
# ==========================================
pipeline:
  type: 'walk_forward'
  version: '4.5.6'
  features_version: 'v456'
  cache_features: true
  cache_predictions: true
  realtime:
    enabled: true
    buffer_size: 100
    update_frequency: 'per_candle'

