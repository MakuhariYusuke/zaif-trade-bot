# Stage 1 Trade Reduced - Phase 4 Day 6 実験D
# 目的: 取引抑制による取引回数50%削減（49番優先2）
# 基準: stage1_hold_removed.yaml からの累積差分
#   - Hold削除（実験C継承）
#   - 取引ペナルティ10倍強化
#   - Cooldown期間2倍延長
#   - アクション変化ペナルティ追加

name: "stage1_trade_reduced"
description: "Trade reduction - stronger frequency/cooldown penalties for Phase4 Day6 D"
curriculum_stage: "simple"
use_simple_reward: false
reward_scale: 100.0

# ===== 報酬ウェイト設定 =====
profit_weight: 1.0
risk_weight: 0.3
consistency_weight: 0.1

# ===== Hold削除（実験C継承） =====
trading_bonus: 0.0

# ===== 取引抑制強化（49番優先2） =====
trade_frequency_penalty: 0.01  # 0.001 → 0.01（10倍）
trade_cooldown_steps: 10  # 5 → 10（2倍）
trade_cooldown_penalty: 0.05  # 0.01 → 0.05（5倍）

behavior_optimization:
  action_smoothing: 0.01  # 0.0 → 0.01（アクション変化ペナルティ）

# ===== 報酬クリップ（実験C継承） =====
reward_clip_min: -1.0
reward_clip_max: 1.0

# ===== リスク管理設定 =====
max_drawdown_penalty_weight: 0.5
drawdown_threshold: 0.05
risk_free_rate: 0.0

# ===== ポジション管理 =====
position_penalty_weight: 0.1
max_position_ratio: 1.0

# ===== その他の設定 =====
consistency_penalty_weight: 0.05
sharp_ratio_bonus_weight: 0.0
max_holding_time_penalty_weight: 0.0

# ===== 実験メタデータ =====
# 作成日: 2026-01-28
# Phase 4 Day 6 実験D
# 期待効果: 取引回数 275回 → 140回以下（50%削減）
# 根拠: trade_frequency_penalty 10倍 + cooldown 2倍
# 前提: stage1_hold_removed.yamlの改善継承
