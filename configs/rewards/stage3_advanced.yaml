# Stage 3: Advanced Reward Design (ポートフォリオ最適化型)
#
# 設計方針:
# - Ultra Profitモードを有効化
# - 一貫性重視のポートフォリオ最適化
# - 動的報酬シェーピングの完全活用
# - 強制バランスの導入
#
# 想定される動作:
# - 高収益・低リスクの両立
# - 極めて安定した取引パターン
# - 市場環境への高度な適応
# - ポートフォリオ全体の最適化

name: "stage3_advanced"
description: "Advanced reward with portfolio optimization and ultra profit mode"
curriculum_stage: "profit_optimized"

# 基本スケール設定
use_simple_reward: false
reward_scale: 100.0

# ポートフォリオ最適化バランス
profit_weight: 1.0
risk_weight: 0.5  # Stage 2の0.7から適度に調整
consistency_weight: 0.6  # Stage 2の0.3から大幅増加

# 取引関連ボーナス/ペナルティ (最適化)
trading_bonus: 0.015  # Stage 2の0.01から増加
trade_frequency_penalty: 0.0015  # Stage 2の0.002から若干緩和
trade_frequency_halflife: 120.0  # Stage 2の100.0から増加
trade_cooldown_steps: 6  # Stage 2の8から若干緩和
trade_cooldown_penalty: 0.015  # Stage 2の0.02から若干緩和
max_consecutive_trades: 4  # Stage 2の3から増加
consecutive_trade_penalty: 0.06  # Stage 2の0.08から若干緩和

# ポジション管理 (バランス重視)
position_soft_cap: 0.45  # Stage 2の0.4から若干緩和
position_penalty_scale: 0.12  # Stage 2の0.15から若干緩和
position_penalty_exponent: 2.1  # Stage 2の2.2から若干緩和

# 在庫管理
inventory_window: 20  # Stage 2の15から増加
inventory_penalty_scale: 0.012  # Stage 2の0.015から若干緩和

# ボラティリティ関連 (最適化)
volatility_window: 40  # Stage 2の30から増加
volatility_penalty_scale: 0.015  # Stage 2の0.02から若干緩和

# リスク調整済みリターン (最大化)
sharpe_bonus_scale: 0.05  # Stage 2の0.03から増加
sortino_bonus_scale: 0.04  # Stage 2の0.025から増加
calmar_bonus_scale: 0.025  # Stage 2の0.015から増加

# バランスペナルティ (強制バランスレベル)
balance_penalty: 1.0  # Stage 2の0.5から増加
balance_penalty_tolerance: 0.02  # Stage 2の0.03から減少

# 報酬クリッピング
reward_clip_value: 100.0
reward_clip_min: -80.0
reward_clip_max: 80.0

# エントロピー正則化 (中程度)
entropy_bonus: 0.02  # Stage 2の0.01から増加
entropy_regularization: 0.02  # Stage 2の0.01から増加

# アクションスムージング (中程度)
action_smoothing: 0.1  # Stage 2の0.05から増加

# 一貫性ペナルティ (強化)
consistency_penalty: 0.1  # Stage 2の0.05から増加

# 強制多様性 (有効化)
enable_forced_diversity: true

# 未実現損失ペナルティ (強化)
unrealized_loss_penalty_enabled: true
unrealized_loss_penalty_base: 1.15  # Stage 2の1.1から増加
unrealized_loss_penalty_max_steps: 15  # Stage 2の10から増加

# 非対称報酬スケーリング (より顕著)
asymmetric_reward_scaling:
  long_position_reward_multiplier: 1.2  # Stage 2の1.1から増加
  short_position_reward_multiplier: 0.9  # Stage 2の0.95から減少
  long_position_penalty_multiplier: 0.85  # Stage 2の0.9から減少
  short_position_penalty_multiplier: 1.1  # Stage 2の1.05から増加

# 動的報酬シェーピング (完全活用)
dynamic_reward_shaping:
  enabled: true
  market_regime_awareness: true
  volatility_adjusted_rewards: true
  trend_strength_bonus: true
  
  # レジーム係数 (強化)
  regime_coefficients:
    bull_market_bonus_coeff: 1.3  # Stage 2の1.2から増加
    bear_market_penalty_coeff: 0.8  # Stage 2の0.85から減少
    sideways_market_penalty_coeff: 0.85  # Stage 2の0.9から減少
    volatile_market_bonus_coeff: 1.15  # Stage 2の1.1から増加
  
  # ボラティリティ係数 (調整)
  volatility_coefficients:
    high_volatility_threshold: 0.025  # Stage 2の0.02から増加
    low_volatility_threshold: 0.004  # Stage 2の0.005から減少
    high_volatility_bonus: 1.3  # Stage 2の1.2から増加
    low_volatility_penalty: 0.75  # Stage 2の0.8から減少
  
  # トレンド係数 (強化)
  trend_coefficients:
    trend_strength_threshold: 0.0008  # Stage 2の0.001から減少
    strong_trend_bonus: 1.25  # Stage 2の1.15から増加
    weak_trend_penalty: 0.85  # Stage 2の0.9から減少

# 利益ボーナス倍率 (最大化)
profit_bonus_multipliers: [1.0, 2.0, 3.0]  # Stage 2の[1.0, 1.8, 2.5]から増加

# Ultra Profit設定 (有効化)
ultra_profit_multiplier: 2.5  # Stage 2の1.0から大幅増加
ultra_risk_multiplier: 0.4  # Stage 2の1.0から大幅減少

# Behavioral Penalty Calculator設定
behavior_optimization:
  balance_penalty: 1.0
  action_balance_target: 0.333
  consistency_lookback: 100  # Stage 2の75から増加
  skewness_lookback: 20  # Stage 2の15から増加
  action_entropy_lookback: 20  # Stage 2の15から増加
  consistency_min_actions: 5  # Stage 2の3から増加

# レジーム検出設定 (詳細化)
regime_detection_config:
  use_relative: true  # Stage 2のfalseから変更
  reference_window: 1500  # Stage 2の1000から増加
  percentile_threshold: 0.85  # Stage 2の0.8から増加
  adaptation_frequency: 10
  high_volatility_threshold: 0.025
  low_volatility_threshold: 0.004
  trend_strength_threshold: 0.0008

# Forced Balance設定 (新規追加)
forced_balance:
  enabled: true
  min_actions: 20
  exploration_reward: 3.0
  
  # Target ratios
  target_ratios:
    buy: 0.4
    sell: 0.35
    hold: 0.25
  
  # Penalty設定
  penalty:
    scale: 1.5
    threshold_small: 0.05
    threshold_medium: 0.1
    threshold_large: 0.2
    value_small_deviation: 2.0
    value_medium_deviation: 5.0
    value_large_deviation: 10.0
    value_very_large_deviation: 20.0
  
  # Bonus設定
  bonus:
    scale: 1.5
    threshold_small: 0.05
    threshold_medium: 0.1
    value_small_deviation: 8.0
    value_medium_deviation: 15.0
    value_large_deviation: 25.0

# カリキュラム学習設定
curriculum_learning:
  enabled: true
  stages:
    - name: "exploration"
      duration_steps: 50000
      balance_penalty_multiplier: 0.5
      exploration_bonus_multiplier: 2.0
    
    - name: "refinement"
      duration_steps: 100000
      balance_penalty_multiplier: 1.0
      exploration_bonus_multiplier: 1.0
    
    - name: "optimization"
      duration_steps: 150000
      balance_penalty_multiplier: 1.5
      exploration_bonus_multiplier: 0.5

# メタデータ
