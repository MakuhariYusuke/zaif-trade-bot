# Stage 1: Basic Reward Design (Doc00準拠)
#
# 設計方針:
# - PnL重視のシンプルな報酬
# - 過度な取引を抑制する基本的なペナルティ
# - Doc00で定義された基本原則に準拠
#
# 想定される動作:
# - 利益追求が主目的
# - 適度な取引頻度の維持
# - ポジション管理の基礎的な制約

name: "stage1_basic"
description: "Basic reward design following Doc00 principles"
curriculum_stage: "simple"

# 基本スケール設定
use_simple_reward: false
reward_scale: 100.0

# PnL重視の基本設定
profit_weight: 1.0
risk_weight: 0.3
consistency_weight: 0.1

# 取引関連ボーナス/ペナルティ
trading_bonus: 0.01
trade_frequency_penalty: 0.001
trade_frequency_halflife: 100.0
trade_cooldown_steps: 5
trade_cooldown_penalty: 0.01
max_consecutive_trades: 3
consecutive_trade_penalty: 0.05

# ポジション管理
position_soft_cap: 0.5
position_penalty_scale: 0.1
position_penalty_exponent: 2.0

# 在庫管理
inventory_window: 10
inventory_penalty_scale: 0.01

# ボラティリティ関連
volatility_window: 20
volatility_penalty_scale: 0.01

# リスク調整済みリターン (基本レベル)
sharpe_bonus_scale: 0.01
sortino_bonus_scale: 0.01
calmar_bonus_scale: 0.005

# バランスペナルティ (基本レベル)
balance_penalty: 0.1
balance_penalty_tolerance: 0.05

# 報酬クリッピング
reward_clip_value: 100.0
reward_clip_min: -80.0
reward_clip_max: 80.0

# エントロピー正則化 (無効)
entropy_bonus: 0.0
entropy_regularization: 0.0

# アクションスムージング (無効)
action_smoothing: 0.0

# 一貫性ペナルティ (基本レベル)
consistency_penalty: 0.0

# 強制多様性 (無効)
enable_forced_diversity: false

# 未実現損失ペナルティ (無効)
unrealized_loss_penalty_enabled: false

# 非対称報酬スケーリング (均等)
asymmetric_reward_scaling:
  long_position_reward_multiplier: 1.0
  short_position_reward_multiplier: 1.0
  long_position_penalty_multiplier: 1.0
  short_position_penalty_multiplier: 1.0

# 動的報酬シェーピング (無効)
dynamic_reward_shaping:
  enabled: false

# 利益ボーナス倍率 (基本レベル)
profit_bonus_multipliers: [1.0, 1.5, 2.0]

# Ultra Profit設定 (無効)
ultra_profit_multiplier: 1.0
ultra_risk_multiplier: 1.0

# Behavioral Penalty Calculator設定
behavior_optimization:
  balance_penalty: 0.1
  action_balance_target: 0.333
  consistency_lookback: 50
  skewness_lookback: 10
  action_entropy_lookback: 10
  consistency_min_actions: 2

# メタデータ
metadata:
  version: "1.0.0"
  created_date: "2026-01-25"
  phase: "Phase 3 Day 3"
  purpose: "AB Testing Baseline - Simple PnL-focused reward"
  expected_behavior:
    - "Strong profit pursuit"
    - "Moderate trading frequency"
    - "Basic position constraints"
  compatible_environments:
    - "HeavyTradingEnv"
    - "TradingEnvV456"
