# Stage 1 Exploration Tuned - Phase 4 Day 6 実験E
# 目的: SAC探索調整による早期収束（49番優先3）
# 基準: stage1_trade_reduced.yaml からの累積差分
#   - Hold削除（実験C継承）
#   - 取引抑制（実験D継承）
#   - SAC: ent_coef=0.01（固定）、gamma=0.95、learning_rate=0.0005
# 注意: SAC設定は run_ab_reward_experiments.py 内で指定

name: "stage1_exploration_tuned"
description: "Exploration tuned: SAC hyperparam tuning for Phase4 Day6 E"
curriculum_stage: "simple"
use_simple_reward: false
reward_scale: 100.0

# ===== 報酬ウェイト設定 =====
profit_weight: 1.0
risk_weight: 0.3
consistency_weight: 0.1

# ===== Hold削除（実験C継承） =====
trading_bonus: 0.0

# ===== 取引抑制（実験D継承） =====
trade_frequency_penalty: 0.01
trade_cooldown_steps: 10
trade_cooldown_penalty: 0.05

behavior_optimization:
  action_smoothing: 0.01

# ===== 報酬クリップ（実験C継承） =====
reward_clip_min: -1.0
reward_clip_max: 1.0

# ===== リスク管理設定 =====
max_drawdown_penalty_weight: 0.5
drawdown_threshold: 0.05
risk_free_rate: 0.0

# ===== ポジション管理 =====
position_penalty_weight: 0.1
max_position_ratio: 1.0

# ===== その他の設定 =====
consistency_penalty_weight: 0.05
sharp_ratio_bonus_weight: 0.0
max_holding_time_penalty_weight: 0.0

# ===== SAC設定（スクリプト側で指定） =====
# learning_rate: 0.0005（0.0003 → 0.0005）
# ent_coef: 0.01（"auto" → 0.01 固定）
# gamma: 0.95（0.99 → 0.95）
# batch_size: 128（256 → 128）
# gradient_steps: 2（1 → 2）

# ===== 実験メタデータ =====
# 作成日: 2026-01-28
# Phase 4 Day 6 実験E
# 期待効果: ROI -5% → 0%以上（早期収束による損益改善）
# 根拠: ent_coef固定化でSELL偏重抑制、gamma縮小で短期利益重視
# 前提: stage1_trade_reduced.yamlの改善累積継承
