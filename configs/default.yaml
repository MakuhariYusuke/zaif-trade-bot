version: '1.0'
training:
  model_name: 'v433_test_model'
  algorithm: 'sac'
  total_timesteps: 100000
  data_config:
    csv_path: null
    use_real_data: true
    data_path: "data/btc_jpy_real_dataset.csv"
    random_start: true
    min_samples: 10000
  environment:
    initial_balance: 200000.0
    transaction_cost: 1.0e-05
    max_position_size: 1.0
    enable_action_masking: true
    use_continuous_actions: true
    use_standardized_observations: true
    curriculum_stage: balanced_trading
    continuous_to_discrete_threshold: 0.1
    reward_settings:
      use_simple_reward: false
      reward_scale: 100.0
      trading_bonus: 0.01
      profit_bonuses:
        small_profit: 0.001
        medium_profit: 0.005
        large_profit: 0.01
      penalty_coefficients:
        loss_penalty: -0.002
        large_loss_penalty: -0.01
        inactivity_penalty: -0.0001
      entropy_bonus: 0.001
      dynamic_reward_shaping:
        enabled: true
        market_regime_awareness: true
        volatility_adjusted_rewards: true
        trend_strength_bonus: true
        regime_coefficients:
          bull_market_bonus_coeff: 1.2
          bear_market_penalty_coeff: 0.8
          sideways_market_penalty_coeff: 0.9
          volatile_market_bonus_coeff: 1.1
        volatility_coefficients:
          high_volatility_threshold: 0.02
          low_volatility_threshold: 0.005
          high_volatility_bonus: 1.3
          low_volatility_penalty: 0.7
        trend_coefficients:
          trend_strength_threshold: 0.001
          strong_trend_bonus: 1.2
          weak_trend_penalty: 0.9
        regime_detection_window: 20
        adaptation_frequency: 10
  features:
    features: {}
    feature_set: default
    adaptive_feature_selection:
      enabled: true
      selection_method: 'mutual_info'
      top_k_features: 20
      update_frequency: 1000
  sac_hyperparameters:
    learning_rate: 3.0e-04
    buffer_size: 1000000
    learning_starts: 1000
    batch_size: 256
    tau: 0.005
    gamma: 0.99
    ent_coef: 0.1
    target_update_interval: 1
    target_entropy: 'auto'
    train_freq: 1
    # Overfitting prevention parameters
    dropout_rate: 0.1
    l2_regularization: 1.0e-04
    early_stopping:
      enabled: true
      patience: 10
      min_delta: 0.001
evaluation:
  thresholds:
    re_evaluate: 0.05
    monitor: 0.01
  min_samples: 10000
  risk_metrics:
  - sharpe
  - sortino
  - max_drawdown
  performance_metrics:
  - total_return
  - win_rate
  - profit_factor
deployment:
  mode: 'paper_trading'
  paper_trading:
    enabled: true
    virtual_balance: 200000.0
    simulate_latency: true
    simulate_slippage: true
    market_data_source: 'real'
logging:
  level: INFO
  format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
  file_path: null
features:
  features: {}
  feature_set: default
  adaptive_feature_selection:
    enabled: true
    selection_method: 'mutual_info'
    top_k_features: 20
    update_frequency: 1000
