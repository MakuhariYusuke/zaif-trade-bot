# fill_test 設定 — G1.1-exec fill quality 実測
# FillTestConfig / AdaptationConfig / LotSizingConfig の全パラメータを外部化
#
# 使い方:
#   python scripts/v460/run_fill_test.py --config configs/v460/fill_test.yaml --hours 168
#   (CLI 引数は YAML より優先される)
#
# v459 反省: 設定がコード内 dict で形骸化していた → YAML に一元化

# ---- 基本設定 ----
symbol: btc_jpy
order_quantity: 0.001         # 初期ロット (BTC) — Coincheck 最小
cycle_interval_sec: 120.0     # サイクル間隔 (秒)
max_cycle_sleep_sec: 600.0    # 209#: sleep 乗数積み重ね上限 (10分)
order_timeout_sec: 90.0       # 096#: 300→90 (stale order + reprice で早期対応)
order_timeout_sec_sell: 75.0  # 155# S-3: sell は速い撤退が有利 (90→75, -16.7%)
poll_interval_sec: 5.0        # ポーリング間隔 (秒)
post_fill_wait_sec: 30.0      # 約定後 PnL 計測待ち (秒)
post_fill_wait_sec_sell: 90.0  # 168# §4.1 #1: sell 保持期間延長 (30→90s, PnL120>0 が根拠)
results_dir: results/v460/fill_test
start_side: buy               # 開始サイド (buy / sell)
max_preflight_skip: 10        # 046# 連続 preflight 失敗上限 (SAFE_STOP)

# ---- スプレッド比例オフセット (CM-1) ----
spread_offset_ratio: 0.05     # 031# 0.2→0.05: AS 低減のため保守化
min_offset_jpy: 1.0           # 最小オフセット (JPY)
min_spread_jpy: 1000           # 190# C: 1200→1000 (実測 spread=1140JPY で頻繁遮断。1000JPY≈0.97bps)

# ---- リトライ (CM-2) ----
max_order_retries: 2              # 041# 1→2: api_error 削減のため
retry_delay_sec: 2.0

# ---- AS 判定 (CM-3) ----
as_deadzone_bps: 2.5          # 052#: 2.0→2.5 (AS 34.2% なお高い, spread中央値 2281JPY ≈ 16bps, ±2.5bpsは15%ノイズ帯)

# ---- 保存 ----
batch_size: 10                # バッチ保存サイクル数
max_save_retries: 3           # 保存リトライ上限
save_fail_threshold: 3        # 緊急ダンプ発動の連続失敗回数

# ---- ログ ----
progress_log_interval: 50     # 進捗ログ出力の間隔 (サイクル数)
log_max_bytes: 10485760       # ログファイル上限 (bytes, 10MB)
log_backup_count: 5           # ログバックアップ世代数

# ---- 方策 A: パラメータ適応 (032# P0) ----
adaptation:
  enabled: false              # 122# R2 (P0): 因果分離のため無効化 (was: true)
  interval_cycles: 50         # 適応判定の間隔
  min_fill_rate: 0.80         # fill_rate 下限 (下回ると offset 増)
  max_as_ratio: 0.15          # AS_ratio 上限 (上回ると offset 減)
  step_ratio: 0.01            # 1 回の offset 調整量
  min_offset_ratio: 0.01      # offset 下限
  max_offset_ratio: 0.30      # offset 上限
  min_samples: 50             # 適応判定の最小サンプル数
  recency_window: 120         # 096# 直近 N 件のみ使用 (0=全件)

# ---- 方策 B: 動的ロットサイジング (033#) ----
lot_sizing:
  enabled: false              # 動的ロット有効化
  interval_cycles: 50         # ロット適応判定の間隔
  min_lot: 0.001              # ロット下限 (BTC)
  max_lot: 0.005              # ロット上限 (BTC)
  lot_step: 0.001             # 1 段階の増減量 (BTC)
  min_fill_rate: 0.70         # 増量に必要な約定率
  max_as_ratio: 0.30          # 増量に必要な AS 上限
  min_recent_pnl_bps: 0.0     # 増量に必要な直近平均 PnL (bps)
  min_samples: 50             # 判定の最小サンプル数
  recent_pnl_window: 50       # 直近 PnL 計算ウィンドウ (件数)
  # 131# D1: レジーム連動ロット制御
  regime_guard_enabled: true   # レジームによるロット増量抑制
  regime_hold_regimes:         # 増量を hold するレジーム (AS リスク高)
    - unknown
  regime_decrease_regimes: []  # 減量を強制するレジーム (空=なし)

# ---- 151# P3-03: AS 確率連動ロットサイジング (confidence_lot) ----
# 152# 検証結果: order_quantity == min_order_btc が 99.7% → 完全 no-op のため有効化見送り
# 有効化条件: order_quantity > min_order_btc (例: 0.003 BTC) に引き上げ後に再検討
confidence_lot:
  enabled: false              # 152#: 有効化見送り (order_quantity=min_order_btc で no-op)
  scale: 1.0                  # AS prob → lot 縮小傾斜
  floor: 0.3                  # 最小 lot 倍率 [0, 1]
  mode: "as"                  # "as" only ("pnl" は凍結)

# ---- 158# resilience (CircuitBreaker / HealthMonitor) YAML 外部化 ----
resilience:
  circuit_breaker:
    failure_threshold: 5          # API 連続失敗→OPEN
    recovery_timeout: 120.0       # OPEN→HALF_OPEN 待機 (秒)
    success_threshold: 2          # HALF_OPEN→CLOSE 成功回数
    timeout: 30.0                 # API タイムアウト (秒)
  health_monitor:
    rss_warn_mb: 1500.0           # RSS 警告閾値 (MB)
    rss_critical_mb: 2500.0       # RSS 緊急閾値 (MB) — OOM 回避
    disk_free_warn_gb: 2.0        # ディスク空き警告 (GB)
    gc_interval_cycles: 100       # GC 実行間隔 (サイクル数)
    check_interval_sec: 300.0     # ヘルスチェック間隔 (秒)

# ---- レジーム検知 (035# §4) ----
regime:
  enabled: true               # レジーム判定の有効化
  window: 20                   # 判定ウィンドウ (直近 N 観測)
  trend_threshold_pct: 0.5     # トレンド判定の価格変化率閾値 (%)
  high_vol_multiplier: 2.0     # 高ボラ判定倍率 (baseline 比)
  hysteresis_count: 3          # 状態確定までの連続一致数
  min_confidence: 0.2          # 152#: 0.3→0.2 (classify最低値0.4で不発のため引き下げ)
  trending_offset_boost: 1.5   # 052#: trending PnL -1.2bps → offset ×1.5 で保守化
  # 157# §19: trending offset boost の buy/sell 非対称化
  # trending_up 時: buy は順張り (有利方向) → boost 縮小、sell は逆行リスク → full boost
  # trending_down 時: sell は順張り (有利方向) → boost 縮小、buy は逆行リスク → full boost
  trending_offset_boost_buy: 1.0     # buy は trending 時 boost なし (有利方向取引で offset 拡大は利益ロス)
  trending_offset_boost_sell: 1.5    # sell は trending 時 full boost 据え置き (逆選択防御)
  # 176# B: 方向×サイド別 offset boost (skip_sell_trending=false と併用)
  # trending_up 時: buy は順張り → offset 縮小 (0.7) で積極約定
  # trending_up 時: sell は逆張り → offset 拡大 (1.8) で保守的利確
  # trending_down 時: 対称逆転 (sell 順張り、buy 逆張り)
  # 2/25 実証: trending_up buy +4.02bps, sell +1.51bps → 両方向活用で収益最大化
  trending_up_buy_offset_boost: 0.7
  trending_up_sell_offset_boost: 1.8
  trending_down_buy_offset_boost: 1.8
  trending_down_sell_offset_boost: 0.7
  # 156# §18: ranging 時に offset 縮小 → 安定市場で fill_rate+利幅確保
  ranging_offset_discount: 0.90   # ranging 時 offset × 0.90 (控えめ開始、A/B で 0.85 検証予定)
  # 227# C1: OBI方向非対称 — ranging市場でOBIに基づく方向性シグナル
  ranging_obi_asymmetry_factor: 0.0  # OBI非対称強度 [0,1] (0.0=無効, 0.3推奨開始値)
  ranging_obi_threshold: 0.1         # OBI非対称適用の最小imbalance閾値
  # 168# §9.10: 低ボラティリティ offset boost (time_filter 根本対策)
  # vol_ratio < threshold の低ボラ環境で offset を 1.4 倍に拡大
  # データ根拠: 損失時間帯 vol_ratio=0.661 vs 利益時間帯 0.918 (t=-2.01)
  # 168# §9.11: 0.70→0.75 — order/fill間のvol_ratio遅延に対する安全マージン
  low_vol_offset_boost_enabled: true
  low_vol_offset_boost: 1.4
  low_vol_threshold: 0.75
  # 200# C: 低ボラ boost 比例モード
  low_vol_boost_proportional: true   # vol_ratio に応じた段階的 boost
  low_vol_boost_min: 1.0             # 比例モード時の最小 boost
  # 169# B1': ranging_buy at low_vol ハードスキップ (Gemini 10.2-D「休むも相場」)
  # ranging_buy は全損失の 69% (-220.84 JPY) を占める最大損失源
  # 低ボラ環境では offset 調整より完全スキップが clean
  skip_ranging_buy_low_vol: true
  # 195# B1' ソフト化: hard skip → maker_price low_vol_offset_boost に委譲
  # ranging_buy_low_vol の hard skip を無効化し、low_vol_offset_boost (1.4x) のみで対応
  ranging_buy_low_vol_as_offset: true
  # 189# D: MacroRegime (長周期レジーム) — micro との conflict 検出
  macro:
    enabled: false              # 189# 初期は観測のみ (conflict_action=log)。Phase E で downgrade 移行
    bucket_sec: 30.0            # macro 判定の bucket 幅 (秒)
    slope_threshold: 1.0        # trending 判定の slope 閾値 (bps/min)
    strong_threshold: 3.0       # strong trend の slope 閾値 (bps/min)
    conflict_action: log        # "log"=観測のみ, "downgrade"=conflict 時に ranging 降格

# ---- 時間帯フィルター (041#) ----
# 169# time_filter 全廃 (107# Phase 3 Step 3 完了)
# 根本原因分析: 全ての時間帯遮断は「市場状態の時間帯相関」を因果と混同した弥縫策
# 条件ベースフィルタに完全移行: B1' (ranging_buy_low_vol), SkipGate (ML+hour特徴量),
#   VG (velocity/VPIN→offset_boost), sell_dynamic_kill (rolling PnL),
#   trending_sell_skip, DailyDrawdownGuard
# 旧: buy=[16], sell=[8,21], regime_adaptive_buy=[8,12,18], sell=[4,7,14]
# 新: 全リスト空。機構は維持 (即時復帰可能)
time_filter:
  enabled: true               # 041#: 機構維持 (コードパス健全性)
  skip_utc_hours: []           # 163# Step2: global block 廃止
  skip_utc_hours_buy: []       # 169# 全廃: B1' + SkipGate + VG が根本対策
  skip_utc_hours_sell: []      # 169# 全廃: sell_dynamic_kill + trending_sell_skip + VG
  # 110# 086# デッドロック修正: 時間帯遮断が空なら不要だが安全弁として維持
  max_086_consecutive_wait: 3
  # 163# regime 連動動的ゲーティング — 機構維持 (VG が high_vol を直接処理)
  regime_adaptive_enabled: true
  regime_adaptive_extra_buy: []   # 169# 全廃: VG が high_vol offset_boost を担当
  regime_adaptive_extra_sell: []  # 169# 全廃: sell_dynamic_kill + VG が担当

# ---- 049# E3 サンプリング ----
e3:
  sampling_ratio: 0.50         # 073#: 0.33→0.50 (120s horizon +0.101bps、データ収集強化)

# ---- 049# side 別 offset ----
# buy は共通値 (0.05) を継承、sell のみ保守化
side_offset:
  # buy: 0.05                  # buy 側は共通値で十分 (PnL -0.10bps)
  sell: 0.18                   # 121# A2: 0.14→0.18 / 156# D-3: A/Bで 0.15→0.14 段階縮小予定

# ---- 049# 即約定防御 ----
fast_fill_defense:
  enabled: true                # queue_wait<=閾値 + 負エッジ時に次サイクル保守化
  threshold_sec: 5.0           # 共通閾値 (この秒数以下で「速い約定」)
  threshold_sec_buy: 10.0      # 100# P0-4: buy 防御有効化 (旧 null=5s では実質無効)
  threshold_sec_sell: 15.0     # 093# sell 側閾値: 084# 盲点C Q1-Q2+α 防御 (sell fast fill は破滅的: 090# -1.66bps)
  offset_boost: 2.0            # 共通防御時 offset 倍率
  offset_boost_buy: null       # 093# buy 側倍率 (null=共通値使用)
  offset_boost_sell: 2.5       # 093# sell 側強化: sell AS は構造的に悪い→強い防御
  # 230# H-1: Layer 2 deadzone — 正常 spread cost を超えた損失のみ AS 認定
  l2_deadzone_bps: 3.0
  # 230# H-2: boost 解除に必要な連続正常 fill 数 (Kyle 1985)
  boost_release_streak: 3

# ---- 094# stale order 検出 & cancel-replace ----
stale_order:
  enabled: true                # 価格乖離した注文を検出して再発注
  check_after_sec: 30.0        # 発注後この秒数以降でチェック開始 (共通)
  drift_bps: 5.0               # mid price がこの bps 以上乖離したら stale 判定 (共通)
  max_reprice: 2               # 1 サイクル内の最大再発注回数 (共通)
  cooldown_sec: 10.0           # 再発注後のチェック猶予 (連続 reprice 防止)
  # 096# side-specific: buy は早期介入 + reprice 1回限定
  check_after_sec_buy: 15.0    # buy 側: 15s でチェック開始 (AS 回避の早期介入)
  check_after_sec_sell: 20.0   # 157# §19: 30→20s (buy 15s との差を縮める、stale 検出の迅速化)
  drift_bps_buy: 4.0           # buy 側: 4bps で stale 判定 (buy AS 狙い撃ち回避)
  drift_bps_sell: 5.0          # sell 側: 5bps (据え置き)
  max_reprice_buy: 1           # buy 側: 1回限定 (追随コスト制限)
  # 137# P1-06: sell 側 reprice 上限 2→1 に縮小。
  # reprice=2 の平均は -3.44bps (134# §3 分析) で損失源。
  # AB: 1→2 に戻す場合は YAML でこの値を 2 に変更。
  max_reprice_sell: 1          # sell 側: 1回 (134# P1-06: 2→1 縮小)
  # 168# P2-C2: reprice 後の offset を mid に 15% 寄せ、drift PnL 改善
  reprice_tighten: 0.85
  # 168# P2-C3: reprice 時の SkipGate 閾値緩和 offset (bps)
  #   AS mode: threshold += offset (高→緩), PnL mode: threshold -= offset (低→緩)
  reprice_skip_gate_offset: 0.05

# ---- 安全設計 (000# §3.9) ----
safety:
  loss_cap_auto: true          # 041#: API残高から動的算出
  loss_cap_ratio: 0.05         # 041#: 残高の 5% をハードキャップ
  soft_loss_cap_ratio: 0.02    # 046#: 残高の 2% でソフトキャップ (ロット半減)
  loss_cap_jpy: 10000.0        # フォールバック値 (API 取得失敗時)
  loss_cap_warning_ratio: 0.7  # 上限の 70% で警告・ロット縮小

# ---- 054# S1: Orderbook Imbalance ベース AS 予測フィルター ----
# 071# 板情報無視: 価格ベースのみで判断
imbalance:
  enabled: false               # 071# 無効化
  depth: 5
  threshold: 0.3
  offset_boost: 1.5
  skip_threshold: 0.7

# ---- 054# S2: Smart Side Selection ----
# 071# 板情報無視: imbalance 依存のため無効化
smart_side:
  enabled: false               # 071# 無効化
  mode: suppress
  max_consecutive_same: 2

# ---- 054# S3: テール損失カット (Early Exit) ----
# 120# P0: 119# 分析で EE 48件=-345.5bps が全損失の137%を生成。
# EE 除去で +218.8bps の正期待値。計測止めバイアスがリバージョン利益を破壊。
early_exit:
  enabled: false               # 120# true→false: 119#/120# 分析に基づき無効化
  threshold_bps: 5.0           # この損失に達したら rapid exit フラグ
  monitoring_interval_sec: 5.0 # 監視刻み (秒)
  rapid_exit_interval_sec: 10.0 # rapid exit 時の cycle interval

# ---- 054# S4: Spread 適応型 Offset ----
# 120# A1: 実測 spread_bps median=2.43, max=5.03 → 旧閾値(10/25)では全件 narrow 判定
#   分布に合わせて narrow=P75(3.0), wide=P95(4.5) で再設計
spread_adaptive:
  enabled: true                # スプレッド幅に応じた offset 動的調整
  narrow_spread_bps: 2.5       # 121# A3: 2.0→2.5 P50近辺に引上げ→postonly_reject -20~30%削減 (168h 65件→~45件)
  narrow_spread_boost: 2.0     # 狭スプレッド時の offset 倍率 (共通フォールバック)
  narrow_spread_boost_buy: 2.0 # 183# 1.5→2.0 (spread<2kでAS32%: buy/sell対称化。<2k帯PnL=-0.46bps改善狙い)
  narrow_spread_boost_sell: 2.5 # 183# 2.0→2.5 (spread<2kでAS32%: sell側のoffset拡大で逆選択回避強化)
  wide_spread_bps: 4.5         # 120# 25.0→4.5: P95相当。max(5.03)に近い帯で wide 判定
  wide_spread_ratio: 0.5       # 広スプレッド時の offset 割引

# ---- 062# S5: SkipGate ML フィルター (AS 分類器ベース) ----
# 071# OB 特徴量除去: 価格・取引データのみで判断 (v459 方式回帰)
# 072# use_ob_features トグル追加: ph2 通過後に true へ切替で OB 特徴量復元
# 124# v3: モデル交代 — LR+AS30 → GBM+really_bad30 (catastrophe avoidance)
#   GBM_sklearn_really_bad30_base WF結果: S20%_30=+0.114, S20%_120=+0.224 (逆選別なし)
#   P(really_bad30) > threshold → skip (mode=as 互換: 高確率 = skip)
skip_gate:
  enabled: true
  # 124# v3: 逆選別なし → 両 side 再有効化 (118# A3 sell_enabled: false を解除)
  buy_enabled: true
  sell_enabled: true             # 124#: GBM really_bad30 は逆選別なし → sell も有効化
  # 127# C1: mode/model_path/use_ob_features を retrain と統一 (single source of truth)
  mode: pnl                    # 127# as→pnl: 125# LGBM PnL120 回帰モデルに切替
  model_path: models/v460/skip_gate_lgbm_pnl120.pkl  # 127# retrain と統一 (C1)
  # 141# P1-01: side 別モデルパス (null=統一モデルにフォールバック)
  model_path_buy: models/v460/skip_gate_lgbm_pnl30_buy.pkl
  model_path_sell: models/v460/skip_gate_lgbm_pnl120_sell.pkl
  # 189# C-1: ev_weighted 用 alt horizon モデル (buy=pnl120長期, sell=pnl30短期)
  model_path_buy_long: models/v460/skip_gate_lgbm_pnl120_buy.pkl
  model_path_sell_short: models/v460/skip_gate_lgbm_pnl30_sell.pkl
  # 189# ev_weighted: 両 horizon 統合判定 (w30×短期PnL + w120×長期PnL)
  # buy pnl120 skip20: +2.075bps, sell pnl30 skip20: +1.272bps — 収益改善確認済み
  ev_weighted_enabled: true
  ev_w30: 0.4                  # 短期 PnL 重み (即時平均回帰)
  ev_w120: 0.6                 # 長期 PnL 重み (持続的回復)
  # 193#: ev_weighted → offset 修飾子モード (192# §5.2 + Gemini §9.4)
  # true: ev_weighted は PASS/SKIP ゲートではなく offset 乗数として機能
  # ev_score が負 → offset 縮小 (保守的価格)、正 → offset 拡大 (積極的)
  ev_as_offset_enabled: true
  ev_offset_sensitivity: 0.05   # ev_score → offset 乗数の感度
  ev_offset_min_mult: 0.5       # offset 乗数下限 (最も保守的)
  ev_offset_max_mult: 1.5       # offset 乗数上限 (最も積極的)
  ev_emergency_skip_threshold: -8.0  # この値未満は依然ハードスキップ
  # 200# M: ev warning zone — emergency と通常の間の中間段階
  ev_warning_threshold: -4.0         # この値未満で warning zone 発動
  ev_warning_offset_factor: 0.7      # warning zone での追加 offset 乗数 (保守化)
  # 190# A: ev_weighted 連続 skip 安全弁 (193# offset モードでは無視)
  ev_max_consecutive_skip: 5
  # 190# B: 片側 balance 時の ev_weighted threshold 緩和 (193# offset モードでは無視)
  ev_one_sided_threshold_shift: -1.0  # threshold を -1.0bps シフト（取引再開優先）
  as_threshold: 0.50           # 120# 0.52→0.50: P(AS)=0.50 が変曲点 (AS 18.1%→36.7%)
  as_threshold_buy: 0.50       # 120# A3: [0.50,0.52) 帯 n=60 PnL=-0.247 AS=36.7% → skip 対象化
  as_threshold_sell: 0.50      # 100# P0-2: sell 側厳格化 (旧 0.60 → 0.50)
  pnl_threshold: -0.5          # 190# D: 0.0→-0.5 (ev_weighted score が常時負のため閾値緩和)
  max_skip_rate: 0.3
  use_ob_features: true        # 127# H4: retrain と統一 (false→true)
  # 088# 動的閾値較正: 目標 skip 率ベースで閾値を自動調整
  adaptive_threshold: true     # P(AS) 分位点から閾値を動的設定
  target_skip_rate_buy: 0.15   # 107# 0.10→0.15 (time_filter 代替強化: buy 7h遮断→SG に委譲)
  target_skip_rate_sell: 0.250  # 124# 0.25→0.20 (sell再有効化に伴い保守化, 逆選別なし前提)
  adaptive_window: 50          # 較正ウィンドウ (直近 N サイクル)
  adaptive_min_samples: 20     # ウォームアップ期間 (最初の N 件は静的閾値)
  adaptive_step: 0.05          # 100# P0-2: 0.02→0.05 (収束ラグ低減)
  adaptive_floor: 0.35         # 閾値下限 (過剰 skip 防止)
  adaptive_ceiling: 0.80       # 閾値上限
  # 138# P1-03: score calibration (isotonic regression)
  score_calibration: false     # true で score 校正有効化 (AB テスト)
  calibrator_path: null        # calibrator pkl パス (null=インメモリ)
  calibrator_min_samples: 30   # 校正に必要な最小サンプル数
  calibrator_refit_interval: 100  # 自動 refit 間隔 (新レコード数)
  # 141# P1-04: regime 別 PnL 閾値オーバーライド (未指定レジームは pnl_threshold を使用)
  regime_thresholds:
    high_vol: 0.2              # 高ボラ: 厳格化 (予測精度低下を補正)
    ranging: 0.1               # レンジ: やや厳格化
    trending: -0.1             # トレンド: 緩和 (トレンド追従に優位性あり)
    trending_up: -0.1          # 176# 横展開: 方向別キー追加 (フォールバック防止)
    trending_down: -0.1        # 176# 横展開: 方向別キー追加
  # 124# Rule: unknown regime での sell スキップ (WF: S20%_30=+0.198, S20%_120=+0.140)
  skip_sell_unknown_regime: true
  # 130# unknown regime buy offset boost (128# 分析: unknown buy -1.384bps)
  unknown_buy_offset_boost: 2.0  # VG 相当の 2x boost (1.0 = 無効)
  # 165# AS-R1: velocity-based pre-ML skip
  sell_velocity_skip_enabled: true
  sell_velocity_skip_threshold_bps: 6.0   # 183# 8.0→6.0 (AS率28%対策: VG vel adverse med=-0.95, sell急騰局面の捕捉率向上)
  buy_velocity_skip_enabled: true          # 183# false→true (buy AS率28%≒sell同等。急落局面で買い参入を抑制)
  buy_velocity_skip_threshold_bps: -6.0   # 183# -8.0→-6.0 (enableに併せ閾値も保守化)
  # 195# velocity_skip ソフト化: hard skip → offset boost
  velocity_skip_as_offset_enabled: true
  velocity_offset_boost_factor: 1.5       # 197# 2.0→1.5 (boost 1.0-1.5帯 PnL+0.47 vs 2.0帯 PnL-0.37)
  # 196# velocity offset 段階的 boost: 閾値超過量に比例した乗数
  velocity_offset_proportional: true      # 固定→比例モード
  velocity_offset_max_mult: 4.0           # 比例モード上限 (×4.0)
  # 183# 時間帯別 skip_gate 閾値オフセット (UTC hour → PnL threshold 加算)
  # ログ分析: 01h JST(=16UTC)64%AS, 03h(=18UTC)50%, 06h(=21UTC)36%, 17h(=08UTC)42%, 23h(=14UTC)43%
  # PnLモード: 正方向=厳格化 (より高い予測PnLがないとskip)
  hour_offsets:
    14: 0.3    # 23h JST: AS43%, -134.5bps/日 → 厳格化
    16: 0.5    # 01h JST: AS64%, -79.8bps/日 → 最も厳格化
    18: 0.3    # 03h JST: AS50%, -54.8bps/日 → 厳格化
    21: 0.3    # 06h JST: AS36%, -125.8bps/日 → 厳格化 (PnL損失最大時間帯)
    23: 0.2    # 08h JST: AS28%だがPnL-30.7bps → 軽い厳格化
  # 205# §9.4: 時間帯 Hard Skip (Kyle proxy) — 最悪時間帯はサイクル全停止
  # soft offset では抑制不十分な UTC 時間帯。204# 分析: UTC16(JST01 AS64%), UTC21(JST06 PnL-125.8bps/日)
  hard_skip_utc_hours: [16, 21]
  # 183# narrow spread adverse guard: spread < threshold で skip_gate 閾値厳格化
  # ログ分析: spread<2kでAS32% (全体28%), PnL=-0.46bps (全体-0.30bps)
  skip_gate_narrow_spread_threshold_jpy: 2000.0
  skip_gate_narrow_spread_offset: 0.2     # PnLモード: threshold += 0.2 (厳格化)
  # 187# clamp: offset 合計の上下限 (hot-reload 対応)
  offset_floor: -0.3   # 最大緩和
  offset_ceil: 0.5     # 最大厳格化

# ---- 107# Volatility Guard (リアルタイム急変検知) ----
# time_filter の静的遮断では対応不能な「時間帯内の急変」に対応
volatility_guard:
  enabled: true
  # 短期 price velocity: 直近60秒の mid price 変動率 (bps)
  velocity_window_sec: 60       # ウィンドウ (秒)
  velocity_threshold_bps: 12.0  # 183# 15.0→12.0 (VG vel=逆選択最強因子: adverse med=-0.95, non-adverse med=+0.83。感度引上げでoffset boost発動率向上)
  # VPIN (Volume-synchronized Probability of Informed Trading)
  vpin_threshold: 0.60          # 183# 0.63→0.60 (AS28%対策。AS時VPIN mean=0.427 vs non-AS=0.413。感度引上げ)
  # 行動: offset を boost (skip は攻撃的すぎる→データ蓄積後に検討)
  offset_boost_factor: 2.0      # guard 発動時の offset 倍率
  # 168# InvSkew/VG 競合解消: InvSkew が sell offset を緩和した場面で
  #   VG ブーストを抑制し在庫リバランス効果を保全する
  inv_skew_damping_enabled: true

# ---- 088# sell 専用ハードガード ----
sell_guard:
  max_spread_jpy: 5000.0       # 168# P2-C1: 4000→5000。165# SO-1 offset_floor 0.20 で保護強化済 (prev: 085# 4677=-7.37bps)
  offset_floor: 0.20           # 165# SO-1: 0.10->0.20 offset<0.2 sell -0.92bps 226件 推定+173bps (prev 105#: 0.08→0.10 sell offset 最低保証 (sell PnL -0.85bps 対策)

# ---- 133# 止血施策 (P0-08/09/10) ----
loss_control:
  # P0-08: balance_forced_switch 時の発注抑制 (強制fill平均 -1.98bps)
  skip_balance_forced: true
  # 154# C-1/C-2: deadlock 防止 — 片側残高枯渇時は forced でも実行許可
  balance_forced_deadlock_limit: 3
  # 166# HF1: rescue モード有効化 (資金枯渇  レジームスキップ デッドロック対策)
  balance_forced_rescue_enabled: true
  balance_forced_rescue_offset_mult: 1.3  # 171#: 2.0→1.3 (2.0では fill率低下でrescue無力化。1.3で実効的な約定を確保)
  # 202# A: 単一サイクル大損失クールダウン (連鎖損失防止)
  loss_cooldown_threshold_bps: -10.0   # PnL がこの値以下で次サイクル interval 延長
  loss_cooldown_interval_mult: 2.0     # 損失後の interval 乗数 (1サイクル限定)
  # 204# I: per-fill loss offset boost — 大損後に offset を一時的に拡大
  loss_boost_offset_mult: 1.3          # 大損後の offset 乗数 (1.0=無効)
  # 226# T1: loss_boost 指数減衰 — AS理論に基づく情報非対称性リスクの指数減衰
  # τ=300s → 5分で63%減衰, 10分で86%減衰。1-shot (即消費) から緩やかな防御に移行
  loss_boost_decay_tau_sec: 300.0
  # 205# §9.2: Toxic Fill 同一サイド拒否 (大損後に同一方向を N サイクル完全封鎖)
  # 202# A の interval 延長は不十分 — 同一サイドの連鎖損失を根本遮断
  toxic_fill_veto_threshold_bps: -5.0  # この PnL 以下で同一サイド拒否発動
  toxic_fill_veto_cycles: 3            # 拒否サイクル数 (0=無効)
  # 202# B: 片側残高枯渇時にも rescue offset を適用 (強制 sell の AS リスク抑制)
  one_sided_balance_rescue_offset: true
  # 207# §4: one-sided 連続実行制限 (片側残高枯渇での連続強制取引を制限)
  # 205# §4.2 Codex: offset 保護だけでは不十分、interval 延長 + 連続制限が必要
  one_sided_consecutive_limit: 5           # 片側強制取引の連続上限 (0=無制限)
  one_sided_consecutive_interval_mult: 3.0 # 上限到達時の interval 乗数
  # P0-09: unknown レジーム時の buy スキップ (unknown-buy 平均 -1.384bps)
  skip_buy_unknown_regime: true
  # 155# §9: trending レジーム時の sell スキップ (trending-sell 平均 -0.687bps)
  # 176# B: 旧: skip_sell_trending=false → offset 非対称で防御 (trending_sell_skip 廃止)
  # 196#: skip_sell_trending=true + trending_sell_as_offset=true → ハードスキップではなく
  #       offset ×3.0 で保守的 sell 発注 (機会損失回避 + AS リスク抑制)
  skip_sell_trending: true
  # 156# D-4: trending_up のみ skip、trending_down sell は開放
  # 176# A: TRENDING(方向不明) も除外 → 実質 trending_up のみブロック
  skip_sell_trending_up_only: true
  # 196# trending_sell ソフト化: hard skip → offset boost
  trending_sell_as_offset_enabled: true
  trending_sell_offset_boost_factor: 2.0    # 197# 3.0→2.0 (regime 1.8xとの累積で10000JPY spreadで総計 3.6x、実用的な保守的価格)
  # 197# balance_forced 時も trending offset を適用 (forced sell の AS リスク低減)
  balance_forced_apply_trending_offset: true
  # 166# HF4: 連続 sell skip 安全弁上限を 3010 に短縮 (7.3 B.4)
  max_consecutive_trending_sell_skip: 10   # 171#: 20→10 (Guard Paradox対策: 安全弁を早期発動して sell 機会確保)
  # 171# Guard Paradox 対策: 在庫偏重時に sell ガードをバイパスする閾値
  sell_guard_inv_bypass_threshold: 0.3  # InvSkew imbalance >= 0.3 (buy偏重) で sell 抑制解除
  # P0-10: sell 動的 kill (rolling PnL ベースの自動停止)
  sell_dynamic_kill:
    enabled: true
    window: 50                     # rolling ウィンドウ (sell fill 数)
    threshold_bps: -0.5            # この bps 以下で sell 停止
    resume_window: 10              # 156# D-5: 20→10 (40分→約20分へ半減)
    # 139# §9-#2: レジーム別閾値 (regime_name -> threshold_bps)
    regime_thresholds:
      trending_up: -0.3            # 171#: -0.1→-0.3 (Guard Paradox対策: -0.1はほぼ全sell kill、在庫偏重の正フィードバック原因)
      trending_down: -1.0          # 下降トレンド時は sell に寛容
      ranging: -0.5                # レンジ時はデフォルト同等
  # 157# §19: buy 動的 kill (rolling PnL ベースの自動停止 — sell との対称性)
  buy_dynamic_kill:
    enabled: true
    window: 50                     # rolling ウィンドウ (buy fill 数)
    threshold_bps: -0.8            # buy は sell より寛容 (構造的に buy の AS リスクが低い)
    resume_window: 10              # 停止後、N サイクル後に再評価
    regime_thresholds:
      trending_down: -0.5          # 下降トレンド時は buy への許容を縮小
      trending_up: -1.5            # 上昇トレンド時は buy に寛容 (順張り)
      high_vol: -0.5               # 高ボラ時は buy 抑制
  # 137# P1-08: spread 狭小時 pause (too_narrow 拡張)
  narrow_spread_pause:
    enabled: false                 # true で有効化 (AB テスト)
    threshold_bps: 3.0             # spread < この bps で狭小判定
    pause_sec: 5.0                 # 狭小時の待機秒数
    max_consecutive: 3             # 連続スキップ上限 (超過で強行)
  # 137# P1-11: PnL fee 控除統一 (実収益一致)
  pnl_fee_deduction:
    enabled: false                 # true で PnL に fee 控除を適用
    maker_fee_bps: 0.0             # Coincheck maker fee (現在 0%)
    taker_fee_bps: 0.0             # taker fee (参考用)
  # 138# P1-10: preflight pause (dead-cycle 防止)
  preflight_pause:
    enabled: true                  # SAFE_STOP 前の pause 機構
    threshold: 5                   # 連続 preflight 失敗のpause発動閾値
    pause_sec: 300.0               # pause 待機秒数 (5分)
    max_pauses: 3                  # run 内最大 pause 回数 (超過でSAFE_STOP)

  # 162# Inventory Skewing: 在庫偏重に応じた非対称 offset (balance_forced 根本対策)
  inventory_skewing:
    enabled: true                # 163# 有効化 (段階デプロイ: まずドライランで検証)
    window: 100                  # 直近 N fill の在庫偏重を計算
    max_factor: 0.4              # 最大 offset 補正倍率 (40%)
    neutral_band: 0.1            # |imbalance| < 0.1 では補正なし (中立帯)
    # 228# C2: 在庫偏重の時間減衰 — 古い fill 履歴の影響を指数関数的に減衰
    decay_tau_sec: 0.0           # 時間減衰 τ (秒, 0=無効, 1800推奨開始値)
  # 168# §4.1 #3: 日次ドローダウンガード (1日の累積損失制限)
  daily_drawdown:
    enabled: true                # 169# C4: 有効化 (日次累積損失制限で暴走防止)
    hard_limit_bps: -50.0        # 日次累積 PnL がこの bps 以下でトレード全停止
    soft_limit_bps: -30.0        # soft 閾値で lot 半減
    # 200# 10-A/10-E: soft drawdown 時の interval 乗数 (YAML 外部化)
    soft_drawdown_interval_multiplier: 3.0
    # 205# §9.5: 片側 DD Halt — サイド別累積損失超過で片側取引停止
    per_side_enabled: true         # 片側 DD ガード有効化
    per_side_hard_limit_bps: -30.0 # 片側累積 PnL がこの bps 以下でそのサイドを封鎖
    per_side_halt_cycles: 15       # 218# 封鎖サイクル数 (15×120s=30分で解除; 旧0=永続→デッドロック原因)
    # 224# B1: halt解除後ソフトリカバリ — lot半減で段階的復帰
    per_side_recovery_cycles: 5    # リカバリ期間サイクル数 (5×120s=10分; 0=無効)
    per_side_recovery_lot_scale: 0.5  # リカバリ期間中lot倍率 (0.5=半減)
    # 225# 市場理論 (Avellaneda-Stoikov): regime-aware recovery ペナルティ
    recovery_trending_penalty: 0.7    # trending 時は lot ×0.7 追加縮小 (AS リスク残存)
    recovery_high_vol_penalty: 0.8    # high_vol 時は lot ×0.8 追加縮小 (在庫リスク増大)

# ---- 102# チューニングパラメータ (散在マジックナンバーの外部化) ----
tuning:
  max_offset_ratio: 0.30           # offset 比率の共通上限キャップ
  min_offset_ratio: 0.01           # offset 比率の下限 (wide spread floor)
  loss_cap_update_interval: 50     # loss_cap 残高再取得サイクル間隔
  min_loss_cap_jpy: 50.0           # 動的 loss_cap の最低保証額 (JPY)
  mid_trend_validity_sec: 300.0    # mid price trend の有効判定秒数 (5分)
  # 227# C3: velocity EMA ノイズフィルタ — bid-ask bounce 抑制
  velocity_ema_alpha: 1.0            # EMA α (0,1] (1.0=無効, 0.6推奨開始値)
  balance_margin_ratio: 1.01       # buy 残高チェックの手数料マージン (1%)
  balance_shrink_consecutive: 3    # balance_shrink 発動の連続 preflight 失敗回数
  balance_shrink_divisor: 2        # balance_shrink のロット分割係数 (2=半減)
  skip_gate_recent_trades_limit: 50  # SkipGate 直近約定取得件数
  # status_unknown_retry_delays: [2.0, 3.0, 5.0]  # ステータス不明時のリトライ遅延 (秒, デフォルト使用)
  rate_limit_min_backoff_sec: 5.0  # rate-limit 検出時の最低バックオフ (秒)
  save_retry_backoff_sec: 0.5      # バッチ保存リトライの初期バックオフ (秒)
  regime_warmup_multiplier: 3      # regime warm-up のウィンドウ倍率
  e3_60s_multiplier: 2.0           # E3 60s 計測の post_fill_wait_sec 倍率
  e3_120s_multiplier: 4.0          # E3 120s 計測の post_fill_wait_sec 倍率
  adapt_min_side_samples: 20       # side 別適応の最小サンプル数下限
  batch_flush_interval_sec: 600.0  # 時間ベース定期 flush (秒)
  heartbeat_interval_sec: 900.0    # heartbeat 間隔 (秒, time_filter 抑制中)
  # 121# 追加外部化パラメータ
  min_order_btc: 0.001             # Coincheck BTC 最小注文数量 (板取引)
  dust_sweep_enabled: true         # 128# 端数BTC一掃: sell時にdust込みで全額売却
  lock_acquire_retries: 2          # lockfile 取得リトライ回数
  lock_heartbeat_period_sec: 60.0  # 148# lock heartbeat 更新周期 (秒)
  lock_stale_heartbeat_sec: 300.0  # 148# lock heartbeat 陳腐化閾値 (秒, >= 3 * period)
  skip_gate_ob_depth: 5            # SkipGate 板情報取得深度
  retry_backoff_base: 2            # 発注リトライ指数バックオフ底
  soft_loss_cap_lot_divisor: 2     # soft_loss_cap ロット半減の除数
  file_log_level: DEBUG            # ファイルログレベル (DEBUG / INFO / WARNING)
  insufficient_funds_patterns:     # 残高不足エラー判定パターン (日本語含む)
    - "所持金額"
    - "足りません"
  # 158# YAML 外部化: 追加パラメータ
  hot_reload_check_interval_sec: 120.0   # SkipGate モデル差替チェック間隔 (秒, cycle_interval と同程度)
  records_cache_ttl_sec: 10.0             # 適応エンジン レコードキャッシュ TTL (秒)
  trades_recorder_fetch_limit: 100        # TradesRecorder 取得件数 (VPIN 計算用)
  balance_freeze_cycles: 3                # 残高不足 side の凍結サイクル数 (cycle_interval × N)

# ---- 126# SkipGate 定期再学習 ----
# retrain_scheduler.py がバックグラウンドで実行、fill_test とは別プロセス
# 127# C1: model_path / mode / use_ob_features は skip_gate: から継承 (single source)
# Usage: .venv\Scripts\python.exe scripts/v460/ml/retrain_scheduler.py
retrain:
  enabled: true                    # fill_test 起動時に retrain_scheduler を自動起動
  interval_sec: 3600               # 再学習チェック間隔 (秒) — 1時間
  min_new_samples: 30              # 再学習に必要な最小新規サンプル数
  min_total_samples: 100           # 再学習に必要な最小合計サンプル数
  # 130# Bootstrap Phase: run切替直後のスタベーション回避
  bootstrap_min_total_samples: 25  # 130# Y1: 30→25 (初回 deploy 加速。短期高収益の大義優先。品質は本格 retrain で補正)
  bootstrap_min_new_samples: 10    # Bootstrap 段階での最小新規
  bootstrap_threshold: 100         # total < この値なら Bootstrap 段階と判定
  target: pnl30                    # 130# L1: pnl120→pnl30 (e3_sampling_ratio=0.50 で pnl120 カバレッジ 40% → pnl30 は 100%。訓練データ 2.5x)
  # 141# P1-01/02: side 分離モデル + target 二層化
  side_specific_enabled: true        # side 別モデルを追加学習
  target_buy: pnl30                  # buy 側ターゲット (30s で即座に平均回帰)
  target_sell: pnl120                # sell 側ターゲット (120s の回復 horizon で評価)
  # 189# alt horizon (ev_weighted 用): 両サイド補完 horizon を追加学習
  alt_horizon_enabled: true          # alt horizon モデルの自動再学習
  target_buy_alt: pnl120             # buy alt ターゲット (長期回復を補完)
  target_sell_alt: pnl30             # sell alt ターゲット (即時平均回帰を補完)
  side_min_samples: 50               # side 別学習の最小サンプル数
  # 141# P1-12: オンラインパフォーマンスモニター
  online_monitor_enabled: true       # 直近 N fill で skip gate 品質を online 評価
  online_monitor_window: 100         # 評価ウィンドウ (直近 N fill)
  online_monitor_pnl_column: post_fill_30s_pnl  # PnL カラム
  online_monitor_degraded_threshold_bps: -0.3    # pass 平均 PnL がこれ以下で degraded
  # 145# Phase C: R-2a レジーム重み付き再学習
  regime_weighting_enabled: true     # 145# Phase C: 有効化 (R-2a)
  regime_sample_weights:             # レジーム → weight マッピング
    high_vol: 1.2                    # 高ボラはリスク考慮で upweight
    trending: 0.8                    # トレンドは順張り有利で downweight
    trending_up: 0.8                 # 176# 横展開: 方向別キー追加
    trending_down: 0.8               # 176# 横展開: 方向別キー追加
    ranging: 1.0                     # レンジはニュートラル
    unknown: 0.5                     # unknown は信頼度低で downweight
  regime_current_boost: 1.5          # 直近レジーム一致サンプルへのブースト
  regime_current_lookback: 10        # 直近 N 件から現在レジーム推定
  regime_weight_floor: 0.1           # 重み最低値
  # 127# H2: run_id 分離 (異なる設定の run を混在させない)
  latest_run_only: true            # 最新 run_id のみ学習 (因果崩壊防止)
  exclude_missing_run_id: true     # run_id 欠損行を除外
  # Walk-Forward 品質ゲート
  quality_gate_enabled: true       # 品質ゲート有効化 (新モデルが劣化していたら棄却)
  min_score_improvement: -0.05     # 前モデル比でこの score 以下なら棄却
  absolute_min_score: -0.10        # 127# M1: prev_score 不在時の絶対最低 score
  wf_test_ratio: 0.2              # WF テスト比率 (直近 20% をテスト)
  # LGBM ハイパーパラメータ
  lgbm_n_estimators: 150
  lgbm_max_depth: 4
  lgbm_learning_rate: 0.05
  lgbm_num_leaves: 15
  lgbm_min_child_samples: 20
  # 133# Y1-Y6: LGBM ハイパラ YAML 外部化 (旧: ハードコード)
  lgbm_subsample: 0.8
  lgbm_colsample_bytree: 0.8
  lgbm_reg_alpha: 1.0
  lgbm_reg_lambda: 1.0
  lgbm_random_state: 42
  lgbm_n_jobs: 1
  # 133# Y7: skip percentile (bottom N% skip)
  skip_percentile: 20
  # E1: warm-start (前モデルの Booster を初期値として学習継続)
  warm_start_enabled: true
  # E2: early stopping (WF val split で過学習を自動停止)
  early_stopping_rounds: 20          # N ラウンド改善なし → 停止
  lgbm_n_estimators_max: 300         # early stopping 時の上限
  # E3: dead feature pruning (split=0 の特徴量を自動除外)
  feature_pruning_enabled: true
  feature_pruning_min_importance: 0   # split 回数がこれ以下なら除外
  feature_pruning_min_trees: 20       # 131# A.1 #7: WF eval 木数がこれ未満なら pruning スキップ (重要度信号不安定のため)
  feature_pruning_require_consecutive: true  # 131# B: 連続 dead (prev+current WF) のみ prune (振動防止)
  # E4: enriched data cache (I/O 削減)
  enriched_cache_enabled: true
  # 131# C1: WF multi-window evaluation (WalkForwardSplitter 統合)
  wf_multi_window_enabled: true        # multi-window WF 評価を有効化
  wf_initial_train_pct: 0.50           # 初期訓練期間の割合
  wf_val_pct: 0.10                     # 検証期間の割合 (early stopping 用)
  wf_test_pct: 0.15                    # テスト期間の割合
  wf_step_pct: 0.20                    # ウィンドウシフト比率
  wf_embargo_rows: 0                   # fill records は日次でない → 行数ベース (min=1)
  wf_min_window_train: 30              # window 当たり最低訓練サンプル数
  wf_min_window_test: 10               # window 当たり最低テストサンプル数
  # 131# C2: 統計的品質ゲート (gate_checks 統合)
  statistical_gate_enabled: true       # Holm-Bonferroni / g1_judgment 統計検定
  statistical_gate_alpha: 0.05         # Family-wise error rate
  statistical_gate_min_effect: 0.147   # Cliff's Delta 最小閾値 (small effect)
  statistical_gate_min_test_samples: 40 # テストサンプル < これなら統計ゲートスキップ
  # 131# C3: 冗長特徴量除去 (redundancy 統合)
  redundancy_pruning_enabled: true     # 高相関特徴量ペアの除去
  redundancy_correlation_threshold: 0.85 # 相関閾値 (これ超えで冗長判定)
  # SkipGate 動的較正
  adaptive_threshold: true
  target_skip_rate_buy: 0.15
  target_skip_rate_sell: 0.20
  # 130# D.1 Q3: trades I/O fallback の窓幅 (日数)
  # 特徴量 window は 60s/300s なので ±1日が適正。過大な窓は I/O 無駄。
  trades_fallback_recent_days: 1  # date_filter 空振り時のフォールバック窓 (±N日)
  # 137# §9 #4: retrain trigger 設定 (YAML 外部化)
  trigger_check_trades_health: true     # trades 健全性チェック
  trigger_trades_lookback_days: 3       # trades lookback 日数
  trigger_trades_stale_threshold_hours: 36.0   # trades stale 閾値 (h)
  trigger_trades_max_missing_days: 2           # 158# trades 欠損日の許容数 (02/20-21 deadlock gap 対応)
  trigger_backoff_multiplier: 2.0       # 連続skip バックオフ倍率
  trigger_backoff_max_interval_sec: 14400  # バックオフ最大 interval (4h)
  trigger_check_feature_freshness: true   # 139# §9-#7: feature 鮮度チェック有効化
  trigger_feature_trades_stale_hours: 6.0  # feature trades stale (h)
  trigger_feature_ob_stale_hours: 6.0     # feature OB stale (h)

# ======================================================================
# 160# P0-B/C: A/B 判定基準 + trending_down sell 評価
# ======================================================================
judgment:
  ab_criteria:
    # --- regime フィルタ (warmup / legacy ノイズ除外) ---
    exclude_regimes:
      - "none"                     # warmup期間 (regime未確定) のレコードを除外
    # --- サンプル要件 ---
    min_filled_records: 50         # variant filled レコード最小数 (< x → INSUFFICIENT)
    min_control_filled_records: 30 # control filled レコード最小数 (対称制約)
    min_calendar_days: 2           # 最低暦日数
    # --- 1. fill_rate ---
    fill_rate_min: 0.30            # 絶対下限 (30% 未満は無条件 FAIL)
    fill_rate_degradation_tolerance: 0.05  # control比 5% 超悪化で FAIL
    # --- 2. avg_pnl30 ---
    avg_pnl30_min_bps: -1.0       # 絶対下限 (bps)
    avg_pnl30_must_improve: false  # true: control よりも改善を要求
    # --- 3. downside_tail ---
    downside_p10_min_bps: -5.0    # p10 絶対下限 (bps)
    downside_p10_degradation_max_bps: 2.0  # control比 2bps以上悪化で FAIL
  trending_down_sell:
    # --- サンプル要件 ---
    min_filled: 10                 # 最低 filled 数 (< x → INSUFFICIENT)
    target_filled: 30              # 統計有意サンプル数
    # --- 判定閾値 ---
    avg_pnl30_min_bps: -0.5       # 平均 PnL30 下限 (bps)
    downside_p10_min_bps: -5.0    # p10 下限 (bps)
    # --- カウンターファクチュアル ---
    counterfactual_pnl30_bps: -0.66  # trending sell skip時の期待損失 (160# §1.3)

# ======================================================================
# 181# regime_policy: 大値動き対応 — C/D/Chase (179# 基盤)
# ======================================================================
# hot-reload 対応: YAML 変更 → 次サイクルで自動反映
# 緊急ロールバック: enabled を false に戻すだけで即時復帰
regime_policy:
  # --- C: Dynamic Cycle Interval (179# §4) ---
  # trending 時はサイクル頻度を 2× に上げ、価格追従を改善
  dynamic_cycle:
    enabled: true
    intervals:
      ranging: 120.0       # 現行維持 (保守的)
      trending: 60.0       # trending × 2× 頻度
      trending_up: 60.0
      trending_down: 60.0
      high_vol: 120.0      # 高ボラ時は保守的に据え置き

  # --- D: Regime-linked Post-Fill Wait (179# §5) ---
  # 順方向の wait を短縮 → 利確速度向上
  # 逆方向は据え置き or 延長 → 逆選択防御
  dynamic_wait:
    enabled: true
    waits:
      ranging:       {buy: 30, sell: 90}     # 現行維持
      trending_up:   {buy: 15, sell: 45}     # buy(順張り)15s, sell(逆張り)45s
      trending_down: {buy: 45, sell: 15}     # sell(順張り)15s, buy(逆張り)45s
      trending:      {buy: 20, sell: 45}     # 方向不明 trending はやや保守的
      high_vol:      {buy: 30, sell: 90}     # 高ボラは現行維持

  # --- Chase: Stale Reprice Aggressive 拡張 (179# §6) ---
  # trending 時に低 drift 閾値で即 reprice → 価格乖離を即座にキャッチ
  chase:
    enabled: true
    drift_bps: 3.0         # 178# §2.3: 3bps で即 reprice (現行 stale は ~10bps)
    max_reprice: 5          # 1 サイクル内の最大 chase 回数
    regimes:
      - trending_up
      - trending_down
      - trending

  # --- 停止条件: C/D/Chase 安全弁 (179# §8) ---
  # いずれか条件トリガーで自動 ranging フォールバック (1h)
  stop_conditions:
    api_error_rate_threshold: 0.03   # 3% 超 → フォールバック
    api_error_window_sec: 7200       # 2h ウィンドウ
    fill_rate_floor: 0.35            # fill_rate 35% 未満 → フォールバック
    fill_rate_window_sec: 21600      # 6h ウィンドウ
    pnl_floor_bps: -0.8             # avg pnl30 -0.8bps 未満 → フォールバック
    pnl_window_sec: 21600           # 6h ウィンドウ
  # 182#/186# EV_weighted 重み + Trend Mode ヒステリシス + 在庫偏り regime 別緩和
  ev_weighted_w30: 0.4               # pnl30 の重み (短期ノイズ抑制)
  ev_weighted_w120: 0.6              # pnl120 の重み (中期シグナル重視)
  trend_min_confidence: 0.45         # 186# enter閾値 (0.55→0.45, trending 発火率向上)
  trend_exit_confidence: 0.30        # 186# exit閾値 (ヒステリシス: 入りやすく出にくい)
  trend_min_dwell: 3                 # 186# 最低保持サイクル数 (trend 粘着性)
  deadlock_limit_trending: 5         # trending 時の deadlock_limit (base=3 より緩和)