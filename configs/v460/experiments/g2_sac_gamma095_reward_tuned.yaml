# G2: SAC 4-seed Training — gamma=0.95 + reward-tuned 実験
# 387# (予定): gamma=0.95 + ペナルティ縮小の複合効果検証
#
# 使用方法:
#   python scripts/v460/run_experiment.py \
#     --config configs/v460/experiments/g2_sac_gamma095_reward_tuned.yaml
#
# 変更点 (g2_sac_gamma095.yaml からの差分):
#   - balance_penalty_value: 1.0 → 0.1 (PnL SNR 改善)
#   - hold_penalty_weight: 0.01 → 0.001 (過剰取引抑制)
#   - consistency_penalty: -0.05 → -0.01 (トレンド転換対応改善)
#   - confidence_penalty_threshold: 0.05 → 0.2 (過剰検出緩和)
# 根拠: docs/v460/386_reward_analysis.md

_base: configs/v460/base.yaml
_gate: G2-train
_task: sac_train

# ---- データ ----
data:
  ohlcv_path: "data/btc_jpy_1m_full_registry_features.parquet"
  v460_features_path: null
  train_end_index: 973544

# ---- 特徴量 ----
features:
  selected:
    - price_velocity
    - micro_trend
    - price_acceleration
    - volume_surge
    - momentum_divergence
    - tick_volume_ratio
    - order_flow_imbalance
    - micro_volatility
    - spread_pressure
    - momentum_burst
    - liquidity_surge
    - realized_volatility
    - parkinson_sigma
    - vpin_proxy
    - kyle_lambda_proxy
    - amihud_illiq
    - ema_velocity_bps

# ---- 環境 ----
environment:
  transaction_cost: 0.0            # 0% (Coincheck Maker)
  reward_scaling: 1.0              # SAC用 (PnL × 1.0)
  max_position_size: 0.01
  initial_portfolio_value: 10000000.0
  use_continuous_actions: true
  action_space_type: "continuous_1d"
  exchange: coincheck
  timeframe: "1m"
  continuous_to_discrete_threshold: 0.10
  continuous_to_discrete_threshold_neg: -0.10

# ---- 報酬ペナルティ調整 (387# Reward Tuning) ----
# 386# 分析: PnL reward O(1-50 JPY) に対してペナルティが過大
# hold_penalty (-0.01) + balance_penalty (-0.5) がShift=0の低ボラstepでPnLを上回る
reward_settings:
  # P0-3: balance_penalty 縮小 (1.0 → 0.1)
  # 理由: BUY/SELL均等化の強制がトレンド追従を阻害
  balance_penalty_value: 0.1
  balance_penalty_tolerance: 0.05
  # P0-4: hold_penalty 縮小 (0.01 → 0.001)
  # 理由: 低ボラ期の不必要な取引誘発を抑制 (Seed456 59K trades対策)
  hold_penalty_weight: 0.001
  # P1-4: consistency_penalty 縮小 (-0.05 → -0.01)
  # 理由: BUY→SELL反転罰がトレンド転換対応を阻害 (Seed123 保守性対策)
  consistency_penalty_value: -0.01
  # confidence_penalty 閾値を引上げ (0.05 → 0.2)
  confidence_penalty_threshold: 0.2
  # 既存設定維持
  position_penalty_weight: 0.01
  pnl_reward_multiplier: 1.0

# ---- SAC ハイパーパラメータ ----
sac_hyperparameters:
  gamma: 0.95                      # 中期割引
  ent_coef: "auto"
  learning_rate: 3.0e-4
  batch_size: 256
  buffer_size: 200000
  learning_starts: 1000
  tau: 0.005
  train_freq: 1
  gradient_steps: 1

# ---- 訓練 ----
training:
  total_timesteps: 100000
  checkpoint_interval: 10000
  val_ratio: 0.2

# ---- 評価 ----
evaluation:
  n_episodes: 1

# ---- Multi-seed ----
seeds: [42, 123, 456, 789]

# ---- 出力 ----
output:
  results_dir: "results/v460"
  model_dir: "models/v460/gamma095_reward_tuned"
