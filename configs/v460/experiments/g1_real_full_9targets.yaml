# G1 再検証: XGBoost Walk-Forward — real 板/約定データ特徴量版
# 014# A3: proxy → real 差替。build_features.py --mode real で生成した Parquet を使用。
#
# Usage:
#   python scripts/v460/run_experiment.py --config configs/v460/experiments/g1_real_full_9targets.yaml
#
# 前提:
#   python scripts/v460/build_features.py --mode real --all-dates
#   → data/v460/features/btc_jpy_1m_v460_real_features.parquet が生成済み

_base: configs/v460/base.yaml
_gate: G1-info
_task: feature_info

data:
  # real features Parquet (build_features.py --mode real で生成)
  v460_features_path: "data/v460/features/btc_jpy_1m_v460_real_features.parquet"
  v460_features_hash: null  # 初回実行時に自動記録
  source_mode: real
  # train_end_index は real data 行数に応じて設定
  # 187 rows (1日分) ではテスト不可 → 3日以上のデータ蓄積後に有効化
  train_end_index: null  # → 80% 自動分割 (walk_forward.train_ratio)

features:
  selected:
    - bid_ask_spread
    - depth_imbalance
    - trade_flow_imbalance
    - vwap_deviation
    - trade_intensity
    - order_flow_toxicity
    - price_impact
    - micro_return_vol
    - bid_depth_slope
    - ask_depth_slope

g1:
  horizons: [1, 5, 15]
  targets: [direction, magnitude, volatility]
