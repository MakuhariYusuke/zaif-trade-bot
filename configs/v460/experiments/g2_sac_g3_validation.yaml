# G2: SAC 2-seed Short — G3 Pipeline End-to-End Validation
# 398# G3 パイプライン検証用短縮実験
#
# 目的:
#   396# で実装した G3 パイプラインが実際のSAC訓練で正しく動作するか検証。
#   特に 398# で修正した portfolio_value 取得バグの修正が機能するか確認。
#
# 使用方法:
#   python scripts/v460/run_experiment.py \
#     --config configs/v460/experiments/g2_sac_g3_validation.yaml
#
# 特徴:
#   - 10K steps × 2 seeds (5分程度で完了する短縮版)
#   - G3 指標が正しく出力されることの確認が主目的
#   - gate 判定の PASS/FAIL は重要ではない (短縮訓練では性能を期待しない)
#
# 検証ポイント:
#   1. seed_results に pf, max_drawdown, sharpe_annual, reward_profit_corr が含まれる
#   2. seed_metrics が空でない
#   3. g3_judgment_cache が結果 JSON に存在する
#   4. max_drawdown > 0 (portfolio_value がゼロでない = 398# fix が有効)
#   5. reward_profit_corr ≠ 0 (相関算出が機能)

_base: configs/v460/base.yaml
_gate: G2-train
_task: sac_train

# ---- データ ----
data:
  ohlcv_path: "data/btc_jpy_1m_full_registry_features.parquet"
  v460_features_path: null
  train_end_index: 973544

# ---- 特徴量 ----
features:
  selected:
    - price_velocity
    - micro_trend
    - price_acceleration
    - volume_surge
    - momentum_divergence
    - tick_volume_ratio
    - order_flow_imbalance
    - micro_volatility
    - spread_pressure
    - momentum_burst
    - liquidity_surge
    - realized_volatility
    - parkinson_sigma
    - vpin_proxy
    - kyle_lambda_proxy
    - amihud_illiq
    - ema_velocity_bps

# ---- 環境 ----
environment:
  transaction_cost: 0.0
  reward_scaling: 1.0
  max_position_size: 0.01
  initial_portfolio_value: 10000000.0
  use_continuous_actions: true
  action_space_type: "continuous_1d"
  exchange: coincheck
  timeframe: "1m"
  continuous_to_discrete_threshold: 0.10
  continuous_to_discrete_threshold_neg: -0.10

# ---- SAC ハイパーパラメータ ----
sac_hyperparameters:
  gamma: 0.80
  ent_coef: "auto"
  learning_rate: 3.0e-4
  batch_size: 256
  buffer_size: 50000
  learning_starts: 500
  tau: 0.005
  train_freq: 1
  gradient_steps: 1

# ---- 訓練 (短縮) ----
training:
  total_timesteps: 10000
  checkpoint_interval: 5000
  # val_ratio=0.02 で OOS を ~24K rows に制限 (0.2 だと 243K → 評価に30分)
  val_ratio: 0.02

# ---- 評価 ----
evaluation:
  n_episodes: 1

# ---- Multi-seed (検証用: 2 seeds) ----
seeds: [42, 123]

# ---- 出力 ----
output:
  results_dir: "results/v460"
  model_dir: "models/v460"
  manifest_path: "results/v460/manifest.jsonl"
