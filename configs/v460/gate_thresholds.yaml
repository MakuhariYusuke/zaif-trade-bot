# v460 Gate 閾値定義
# 000# §3 準拠

g0_data:
  data_hash_match: true
  min_feature_columns: 4
  max_nan_ratio: 0.01
  manifest_required: true

g1_info:
  min_ic: 0.02       # OOS Spearman IC 下限
  min_accuracy: 0.51  # OOS accuracy 下限
  min_significant_folds: 2   # p<0.05 の fold 最低数 (/ 5 folds)
  p_alpha: 0.05
  min_cliff_d: 0.33   # Cliff's Delta 最小効果量
  # Multi-target: 3 horizon × 3 target = 9 組合せ
  horizons: [1, 5, 15]
  targets: [direction, magnitude, volatility]
  holm_family_size: 9

g1_1_exec:
  # 116# 後方互換: 旧単一ゲート (g1_1_judgment() から参照)
  min_fill_rate_p90: 0.85  # 084# 盲点H: 90%は構造的に非現実的 → 85%に再設計
  max_cancel_ratio: 0.30
  max_queue_wait_median_sec: 60
  min_post_fill_30s_pnl: 0.0
  max_adverse_selection_ratio: 0.20
  # 092# Round-trip KPI (087# P1-1)
  min_round_trip_pnl_mean: -2.0  # bps — mean がこれ以下ならテール損失警告
  max_net_inventory: 5            # 純在庫ドリフト上限

# 116# 二段階ゲート (115# レビュー反映)
g1_1_quick_exec:
  # G1.1-quick (72h Kill Gate) — 明らかに不成立な戦略の早期棄却
  # 判定時点: 72h or n_attempted >= 300 の早い方
  min_attempted_fill_rate: 0.60         # K1: attempted (skip_gate 除外) ベース
  max_attempted_cancel_ratio: 0.40      # K2: attempted ベース
  max_queue_wait_median_sec: 120        # K3: 300s timeout の半分
  # K4: PnL 複合条件 — p < 0.02 かつ mean <= -0.8 bps の同時成立で FAIL
  pnl_kill_p_threshold: 0.02            # 115# Q10.2(C): 単独 p 値判定は不十分
  pnl_kill_mean_threshold: -0.8         # bps — 効果量条件を併設
  max_cumulative_loss_jpy: 10000        # K5: 000# §3.9 実損キャップ
  max_skip_gate_ratio: 0.25             # K6: SkipGate 過剰ブレーキ防止
  # Watch 層 (FAIL ではなく黄信号 — 115# Q10.4)
  pnl_watch_p_threshold: 0.05           # p < 0.05 かつ mean < -0.3 bps → WATCH
  pnl_watch_mean_threshold: -0.3        # bps

g1_2_full_exec:
  # G1.2-full (168h Qualification Gate) — 完全な品質適格性の確認
  # 判定時点: 168h (7 暦日) 完了後
  min_attempted_fill_rate: 0.70         # F1: attempted ベース
  min_overall_fill_rate: 0.62           # F1b: 115# Q10.2(A) overall 下限併設
  max_attempted_cancel_ratio: 0.30      # F2: 原初 E2 を attempted ベースで維持
  max_queue_wait_median_sec: 60         # F3: 原初 E3 維持
  pnl_alpha: 0.05                       # F4: 有意に負でないこと
  max_adverse_selection_ratio: 0.30     # F5: 115# Q10.2(B) 35→30 に厳格化
  max_skip_gate_ratio: 0.20             # F6: SkipGate 過剰スキップ監視
  min_calendar_days: 7                  # F7: 全曜日カバレッジ
  min_attempted_samples: 500            # F8: 統計的検出力保証 (MDE ≈ ±0.5 bps)

g2_train:
  min_positive_seed_ratio: 0.75   # 3/4
  max_ic_seed_std: 0.03
  convergence_window_start: 30000
  max_roi_variance_pct: 5.0
  worst_seed_min_roi: -0.02

g3_pnl:
  min_pf_median: 1.05
  min_pf_worst: 0.95
  max_drawdown: 0.15
  min_sharpe_annual: 0.8
  gross_gt_fee: true

g4_live:
  min_paper_days: 7
  # 詳細は Phase 5 で確定
