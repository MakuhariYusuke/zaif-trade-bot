version: '1.0'
training:
  model_name: 'sac_test_v435'
  algorithm: 'sac'
  total_timesteps: 50000
  data_config:
    csv_path: null
    use_real_data: true
    data_path: "data/btc_jpy_real_dataset.csv"
    random_start: true
    min_samples: 10000
  environment:
    initial_balance: 200000.0
    transaction_cost: 1.0e-05
    max_position_size: 1.0
    enable_action_masking: true
    use_continuous_actions: true
    use_standardized_observations: true
    curriculum_stage: balanced_trading
    continuous_to_discrete_threshold: 0.1
    reward_settings:
      use_simple_reward: false
      reward_scale: 100.0
      trading_bonus: 0.01
      profit_bonuses:
        small_profit: 0.001
        medium_profit: 0.005
        large_profit: 0.01
      penalty_coefficients:
        loss_penalty: -0.002
        large_loss_penalty: -0.01
        inactivity_penalty: -0.0001
      entropy_bonus: 0.001
  features:
    features: {}
    feature_set: default
    adaptive_feature_selection:
      enabled: true
      selection_method: 'mutual_info'
      top_k_features: 20
      update_frequency: 1000
  sac_hyperparameters:
    learning_rate: 3.0e-04
    buffer_size: 1000000
    learning_starts: 1000
    batch_size: 256
    tau: 0.005
    gamma: 0.99
    ent_coef: 0.1
    target_update_interval: 1
    train_freq: 1
evaluation:
  thresholds:
    re_evaluate: 0.05
    monitor: 0.01
  min_samples: 10000
  risk_metrics:
  - sharpe
  - sortino
  - max_drawdown
  performance_metrics:
  - total_return
  - win_rate
  - profit_factor
deployment:
  mode: 'paper_trading'
  paper_trading:
    enabled: true
    virtual_balance: 200000.0
    simulate_latency: true
    simulate_slippage: true
    market_data_source: 'real'
logging:
  level: INFO
  format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
  file_path: null
features:
  features: {}
  feature_set: default
  adaptive_feature_selection:
    enabled: true
    selection_method: 'mutual_info'
    top_k_features: 20
    update_frequency: 1000