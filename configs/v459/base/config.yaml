version: '4.5.9'
description: "v459 Alpha Resurrection - 統合と収益化への最終章"

# =============================================================================
# Training Configuration
# =============================================================================
training:
  model_name: 'v459_alpha_resurrection'
  algorithm: 'sac'
  total_timesteps: 10000  # Phase 0: 検証用短期実行
  seed: 42  # デフォルトseed
  
  # Multi-seed testing (Phase 4で使用)
  seeds: [42, 123, 456, 777]
  
  # SAC Hyperparameters (v451の成功パラメータを継承)
  sac_hyperparameters:
    gamma: 0.80              # v451: 短期指向の割引率
    ent_coef: "auto"         # 適応的エントロピー
    learning_rate: 3.0e-4
    batch_size: 256
    buffer_size: 100000
    learning_starts: 100
    tau: 0.005
    train_freq: 1
    gradient_steps: 1
    seed: 42

  # Environment Configuration
  environment:
    type: "FastIntradayEnvV456"  # v457.5 patches適用版
    
    # Basic Settings
    initial_balance: 10000000.0    # 1000万円
    transaction_cost: 0.001        # 0.1% (Zaif Maker)
    max_position_size: 0.01        # 0.01 BTC (固定)
    timeframe: "1m"
    min_delta: 0.01
    
    # Action Space
    action_space_type: "1d_position"  # Continuous -1 to +1
    
    # Reward Settings (Stage 1: 純PnL)
    reward_scale: 1.0
    reward_clip: null  # クリッピングなし
    
    reward_settings:
      # Stage 1: 純PnL only (Phase 3で段階的に変更)
      trend_guidance_enabled: false
      guidance_decay_steps: 50000
      guidance_weight: 0.0
      
      # Frequency Control (v455から継承)
      cooldown_steps: 5
      edge_threshold: 0.001  # 0.1%
      
      # v451: Holdペナルティなし
      hold_penalty: 0.0
      hold_grace: 0
      
      # v451: 非対称報酬（検討中）
      asymmetric_loss_weight: 1.0  # Phase 3で1.2に変更可能
    
    # Feature Configuration
    feature_config_path: "config/features/features.yaml"
    
    # Entry Gate Configuration (Phase 0ではdisabled)
    entry_gate:
      enabled: false
      calibration_map_path: "models/v459/entry_gate_calibration.json"
      min_confidence: 0.5
      cooldown_steps: 5
      edge_threshold: 0.001
      
      # Phase 4以降で有効化予定
      volume_check: false
      risk_limits:
        max_daily_trades: 100
        max_position_size: 0.01
    
    # Execution Model (Phase 0で値確定)
    execution_model:
      # コストパラメータ
      costs:
        fee_rate: 0.001           # 0.1% (確定値)
        slippage_rate: 0.0005     # 0.05% (推定、Phase 5で更新)
        slippage_model: "fixed"
      
      # 約定モデル
      execution:
        latency_ms: 500           # 推定値 (Phase 5で更新)
        fill_rate: 0.95           # 推定値
        order_type: "limit"
      
      # リスクパラメータ
      risk:
        max_position: 0.01
        max_daily_loss_pct: 0.03
        consecutive_loss_limit: 5

# =============================================================================
# Walk-Forward Configuration (Phase 4で使用)
# =============================================================================
walk_forward:
  enabled: false  # Phase 4で有効化
  
  # Window Configuration
  window_size_pct: 0.25   # 全データの25%
  step_pct: 0.20          # 20%ずつスライド
  
  # Split Ratio
  train_pct: 0.70
  val_pct: 0.15
  test_pct: 0.15
  
  # Warmup (Doc02 Section 2.5)
  warmup:
    max_lookback_1m: 1440   # 24時間
    max_lookback_5m: 288
    max_lookback_15m: 96
    max_lookback_1h: 168    # 7日
    train_warmup: 168       # Train開始前に168時間必要
    val_warmup: 0
    test_warmup: 0

# =============================================================================
# Evaluation Configuration
# =============================================================================
evaluation:
  # Baseline Comparison (Doc00 Section 5.5)
  baselines:
    buy_and_hold:
      enabled: true
      required: true  # 必須超過
    
    sma_crossover:
      enabled: true
      required: true  # 必須超過
      fast_period: 20
      slow_period: 50
    
    random_action:
      enabled: true
      required: true  # 必須超過
      seed: 42
    
    momentum:
      enabled: true
      required: false  # 参考のみ
      lookback_period: 60  # 1時間
  
  # Statistical Testing (Doc00 Section 5.6)
  statistical_test:
    method: "mann_whitney_u"
    alpha: 0.05
    correction: "holm"  # Holm-Bonferroni
    effect_size: "cliffs_delta"
    min_effect_size: 0.33
  
  # Success Criteria (Doc00 Section 5.2)
  success_criteria:
    net_roi_min: 0.05        # 5% (最低)
    net_roi_target: 0.15     # 15% (目標)
    profit_factor_min: 1.20
    profit_factor_target: 1.50
    sharpe_ratio_min: 1.0
    sharpe_ratio_target: 1.5
    max_drawdown_max: 0.15   # 15%
    win_rate_min: 0.35
    expectancy_min: 500      # ¥500

# =============================================================================
# Data Configuration
# =============================================================================
data:
  source_data: "data/btc_jpy_1m_v451.csv"
  
  # Phase 0-3: 単一期間での開発
  training_start: 0
  training_end: 98800      # ~70%
  validation_start: 98800
  validation_end: 119900   # ~15%
  test_start: 119900
  test_end: 141000         # ~15%
  
  # Phase 4: Multi-split (4期間)
  splits:
    split_1:
      start: "2024-01-01"
      end: "2024-06-30"
      description: "上昇トレンド期"
    
    split_2:
      start: "2024-07-01"
      end: "2024-12-31"
      description: "ボラティリティ高"
    
    split_3:
      start: "2025-01-01"
      end: "2025-06-30"
      description: "レンジ相場期"
    
    split_4:
      start: "2025-07-01"
      end: "2025-12-31"
      description: "直近期間"

# =============================================================================
# Logging Configuration
# =============================================================================
logging:
  log_level: 'INFO'
  project: 'zaif-bot-v459'
  
  # Phase別のログディレクトリ
  log_dir: 'logs/v459'
  checkpoint_dir: 'checkpoints/v459'
  model_dir: 'models/v459'
  
  # TensorBoard
  tensorboard_log: 'tensorboard/v459'

# =============================================================================
# Phase Control
# =============================================================================
phase:
  current: 0  # Phase 0: 仕様固定
  
  phase_0:
    description: "仕様固定"
    duration_days: 1
    deliverables:
      - "Reporter I/O仕様書"
      - "Entry Gate仕様書"
      - "スケーラfit規則書"
      - "実行モデル仕様書"
  
  phase_1:
    description: "P0バグ修正"
    duration_days: 2-3
    target_bugs: ["entry_gate_crash", "config_wiring", "cost_double_count", "val_test_contamination"]
  
  phase_2:
    description: "P1バグ修正"
    duration_days: 3-4
    target_bugs: ["trade_type_classification", "entry_price_update", "reporter_consolidation", "ab_testing"]
  
  phase_3:
    description: "報酬設計段階検証"
    duration_days: 3-4
    stages: ["pure_pnl", "fixed_guidance", "decay_guidance"]
  
  phase_4:
    description: "評価・検証"
    duration_days: 4-5
    tasks: ["walk_forward", "multi_seed", "baseline_comparison", "ab_testing"]
  
  phase_5:
    description: "Paper Trading統合"
    duration_days: 5-7
    tasks: ["execution_model", "paper_trader", "risk_thresholds", "log_collection"]
  
  phase_6:
    description: "Go/No-Go判定"
    duration_days: 2
    gates: ["technical", "profitability", "risk", "execution"]
