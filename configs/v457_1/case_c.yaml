version: '4.5.8-CaseC'
description: "v458 Parameter Tuning Case C: Sniper (Short Holding)"

training:
  environment:
    initial_balance: 1000000.0
    transaction_cost: 0.0005
    max_position_size: 1.0
    min_delta: 0.03
    max_ttl_steps: 30 # Halved from default
    
    reward_settings:
      hold_grace: 20
      hold_ramp: 20.0 # Lowered to allow holding a bit more if needed, OR should it be higher?
      # Re-reading roadmap: "Cases C: ... Short Holding / Early Escape"
      # If hold_ramp is penalty per step, reducing it makes holding CHEAPER.
      # Wait, I might have confused the roadmap intent or the previous setting.
      # Previous: hold_ramp 200 -> 50 (Cheaper hold).
      # Roadmap Case C: hold_ramp 20.0 (Even Cheaper). 
      # BUT "Sniper / Early Escape" usually implies we WANT quick exits.
      # If we want quick exits, we should maybe INCREASE hold penalty? 
      # OR, maybe "Sniper" means we only enter when confident and exit quickly, so we enforce short max_ttl.
      # The roadmap said: "Case C: min_delta: 0.03, hold_ramp: 20.0, max_ttl: 30"
      # Let's stick to the roadmap proposal verbatim to avoid confusion, and analyze results.
      # If hold_ramp is small, they CAN hold longer without pain, but max_ttl=30 forces exit.
