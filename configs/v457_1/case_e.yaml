version: '4.5.8-CaseE'
description: "v458 Frequency Control: High Volatility Only"

training:
  environment:
    initial_balance: 1000000.0
    transaction_cost: 0.0005
    max_position_size: 1.0
    
    # Base Control
    min_delta: 0.03
    max_ttl_steps: 30
    
    # Frequency Suppression
    cooldown_steps: 60
    
    reward_settings:
      hold_grace: 20
      hold_ramp: 20.0
      
      # Strict Low Volatility Filter (Case E)
      edge_penalty_rate: 1.0
      min_edge_mult: 1.5
      vol_floor: 0.002    # Wait for significant volatility (0.2%)
      vol_floor_penalty: 20000000.0
