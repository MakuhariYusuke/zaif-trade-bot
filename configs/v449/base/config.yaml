version: '4.4.9'
training:
  model_name: 'v449_smart_incentive'
  algorithm: 'sac'
  total_timesteps: 200000
  environment:
    initial_balance: 200000.0
    transaction_cost: 1.0e-05
    max_position_size: 1.0

    # Adaptive Thresholding (v449)
    adaptive_threshold_mode: true
    threshold_volatility_multiplier: 1.0
    min_action_threshold: 0.001
    max_action_threshold: 0.05

    curriculum_stage: forced_balance
    reward_settings:
      use_simple_reward: false
      reward_scale: 100.0

      # v449 New Components Configuration
      forced_balance:
        penalty:
          scale: 1.0
          threshold_small: 0.05
          threshold_medium: 0.1
          threshold_large: 0.2
          value_small_deviation: 1.0
          value_medium_deviation: 2.5
          value_large_deviation: 5.0
          value_very_large_deviation: 10.0
        bonus:
          scale: 1.0
          threshold_small: 0.05
          threshold_medium: 0.1
          value_small_deviation: 6.0
          value_medium_deviation: 12.0
          value_large_deviation: 20.0
        scaling: 1.0

      smart_incentive:
        enabled: true
        volatility_threshold: 0.005
        multiplier: 1.1
