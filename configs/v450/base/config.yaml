version: '4.5.0'
training:
  model_name: 'v450_dynamic_threshold_action_discovery'
  algorithm: 'sac'
  total_timesteps: 200000
  environment:
    initial_balance: 200000.0
    transaction_cost: 1.0e-05
    max_position_size: 1.0
    # New: dynamic thresholding options (v450)
    dynamic_threshold_mode: 'z_score'  # options: 'fixed' | 'volatility' | 'z_score'
    z_score_window: 50
    z_score_threshold: 3.0
    z_score_method: 'mad'  # 'std' | 'mad'
    min_action_threshold: 0.001
    max_action_threshold: 0.08
    # Regime detection
    regime_detection_config:
      use_relative: true
      reference_window: 1000
      percentile_threshold: 90
      volatility_percentile_window: 500

    # Curriculum defaults
    curriculum_stage: 'action_discovery'
    reward_settings:
      use_simple_reward: false
      reward_scale: 100.0
      action_discovery:
        enabled: true
        scale: 0.5
        magnitude_bonus: true
        direction_bonus: true
      # Keep some v449 settings in place for migration
      smart_incentive:
        enabled: true
        volatility_threshold: 0.005
        multiplier: 1.1

  sac_hyperparameters:
    learning_rate: 0.0003
    buffer_size: 10000
    learning_starts: 100
    batch_size: 256
    ent_coef: 'auto'

logging:
  log_level: 'INFO'
