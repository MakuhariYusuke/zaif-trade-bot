      quality_score: 0.85
      harmful_features: 0
      category: experimental
      bull_bear_balance: 0.55
      includes_experimental: true

# Quality control settings
quality_control:
  enabled: true
  thresholds:
    max_nan_rate: 0.10
    min_variance: 1.0e-8
    max_zero_rate: 0.80
    max_correlation: 0.95
  excluded_features:
    - dividends      # Always zero
    - stock_splits   # Always zero
    - any_high_nan_features
    - any_zero_variance_features
    - any_excessive_zero_features

# Market regime settings
market_regime:
  bull_detection_threshold: 0.05
  bear_detection_threshold: -0.05
  regime_lookback_window: 20

# Performance metrics (estimated)
performance_estimates:
  minimal:
    training_speed: "fast"
    inference_speed: "fastest"
    expected_accuracy: "baseline"
  balanced:
    training_speed: "medium"
    inference_speed: "fast"
    expected_accuracy: "good"
  high_quality:
    training_speed: "slow"
    inference_speed: "medium"
    expected_accuracy: "high"
  full:
    training_speed: "slowest"
    inference_speed: "slow"
    expected_accuracy: "highest_experimental"