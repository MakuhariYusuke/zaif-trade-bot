# Quality thresholds for feature filtering
quality_thresholds:
  max_nan_rate: 0.10      # Remove features with >10% NaN
  min_variance: 1.0e-8    # Remove features with near-zero variance
  max_zero_rate: 0.80     # Remove features with >80% zeros
  max_outlier_rate: 0.30  # Remove features with >30% outliers
  max_correlation: 0.95   # Flag features with >95% correlation

# Harmful features to exclude (based on analysis)
excluded_features:
  - dividends        # Always zero
  - stock_splits     # Always zero
  - any_high_nan_features  # Features with >10% NaN
  - any_zero_variance_features  # Features with zero variance
  - any_excessive_zero_features  # Features with >80% zeros

# Market regime detection parameters
market_regime:
  bull_threshold: 0.05    # 5% return threshold for bull market
  bear_threshold: -0.05   # -5% return threshold for bear market
  lookback_window: 20     # Days to look back for regime detection

# Technical indicator parameters
technical_indicators:
  rsi_period: 14
  stoch_period: 14
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  bb_period: 20
  bb_std: 2
  atr_period: 14
  volume_ma_short: 5
  volume_ma_long: 20