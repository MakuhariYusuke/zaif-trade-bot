name: Health Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run daily at 9:00 UTC
    - cron: '0 9 * * *'
  workflow_dispatch: # Allow manual triggering

jobs:
  health-check:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov pytest-asyncio requests websockets

    - name: Run health check
      run: |
        python scripts/health_check.py --format json > health_report.json

    - name: Display health report
      run: |
        cat health_report.json | python -m json.tool

    - name: Check health status
      id: health-status
      run: |
        STATUS=$(python -c "import json; print(json.load(open('health_report.json'))['status'])")
        echo "status=$STATUS" >> $GITHUB_OUTPUT

        if [ "$STATUS" = "critical" ]; then
          echo "❌ Critical health issues detected!"
          exit 1
        elif [ "$STATUS" = "warning" ]; then
          echo "⚠️  Health warnings detected"
        else
          echo "✅ System health is good"
        fi

    - name: Upload health report
      uses: actions/upload-artifact@v3
      with:
        name: health-report
        path: health_report.json

    - name: Upload performance data
      uses: actions/upload-artifact@v3
      with:
        name: performance-data
        path: |
          data/performance/performance_history.json
          data/performance/

    - name: Notify on critical issues
      if: steps.health-status.outputs.status == 'critical'
      run: |
        echo "🚨 CRITICAL: System health check failed!"
        echo "Check the health report artifact for details."

    - name: Create GitHub issue on critical failure
      if: steps.health-status.outputs.status == 'critical' && github.event_name != 'schedule'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const healthReport = JSON.parse(fs.readFileSync('./health_report.json', 'utf8'));

          // Check if an issue already exists
          const issues = await github.rest.issues.listForRepo({
            owner: context.repo.owner,
            repo: context.repo.repo,
            labels: ['health-check', 'critical'],
            state: 'open'
          });

          if (issues.data.length === 0) {
            // Create new issue
            const body = '## System Health Check Failed\n\n' +
              '**Status:** ' + healthReport.status + '\n' +
              '**Total Checks:** ' + healthReport.total_checks + '\n' +
              '**Critical:** ' + healthReport.critical + '\n' +
              '**Warnings:** ' + healthReport.warning + '\n' +
              '**Healthy:** ' + healthReport.healthy + '\n\n' +
              '### Details\n' +
              '```json\n' +
              JSON.stringify(healthReport.checks, null, 2) + '\n' +
              '```\n\n' +
              'This issue was automatically created by the health check workflow.\n' +
              'Please investigate and resolve the critical issues.';

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 Critical System Health Issues Detected',
              body: body,
              labels: ['health-check', 'critical', 'automated']
            });
          }

  test-health-module:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install test dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov pytest-asyncio requests websockets psutil

    - name: Run health module tests
      run: |
        python -m pytest tests/test_health.py -v --cov=ztb.ops.health --cov-report=term --cov-report=xml

    - name: Upload coverage reports
      uses: actions/upload-artifact@v3
      with:
        name: coverage-reports
        path: |
          htmlcov/
          coverage.xml