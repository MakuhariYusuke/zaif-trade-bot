[mypy]
python_version = 3.11
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
disallow_untyped_decorators = True
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_no_return = True
warn_unreachable = True
strict_equality = True
show_error_codes = True

# Ignore all modules except action_signal_guide
[mypy-ztb.*]
ignore_errors = True

[mypy-ztb.trading.strategies.action_signal_guide.*]
ignore_errors = False

[mypy-ztb.trading.strategies.action_signal_guide.pattern_recognition.*]
ignore_errors = False

[mypy-ztb.trading.strategies.action_signal_guide.action_signal_guide]
ignore_errors = False

[mypy-ztb.utils.memory_utils]
ignore_errors = False

[mypy-ztb.utils.type_guards]
ignore_errors = False

[mypy-ztb.utils.config_manager]
ignore_errors = False
[mypy-tomli.*]
ignore_missing_imports = True

[mypy-tomli_w.*]
ignore_missing_imports = True

[mypy-numpy.*]
ignore_missing_imports = True

[mypy-pandas.*]
ignore_missing_imports = True

[mypy-optuna.*]
ignore_missing_imports = True

[mypy-sklearn.*]
ignore_missing_imports = True

[mypy-tqdm.*]
ignore_missing_imports = True

[mypy-joblib.*]
ignore_missing_imports = True

[mypy-plotly.*]
ignore_missing_imports = True

[mypy-talib.*]
ignore_missing_imports = True

[mypy-gymnasium.*]
ignore_missing_imports = True

[mypy-stable_baselines3.*]
ignore_missing_imports = True
