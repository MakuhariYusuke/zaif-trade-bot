[mypy]
python_version = 3.11
strict = True
warn_return_any = True
warn_unused_configs = True
disallow_incomplete_defs = True
check_untyped_defs = True
disallow_untyped_decorators = True
no_implicit_optional = True
warn_redundant_casts = True
ignore_missing_imports = True
follow_imports = silent
warn_unused_ignores = True
warn_no_return = True
warn_unreachable = True
strict_equality = True
exclude = (tests/|__tests__/|python/|benchmark_.*\.py|scripts/|ztb/tests/|ztb/__tests__/|test\.py|ztb/training/train_ensemble_models\.py|ztb/training/ensemble_models\.py|ztb/training/bayes_opt_ppo\.py|venv.*|__pycache__|node_modules)

# Module-specific settings
[mypy-ztb.features.*]
disallow_any_decorated = False

[mypy-ztb.trading.live.*]
ignore_missing_imports = True

[mypy-ztb.evaluation.*]
disallow_any_decorated = False
ignore_missing_imports = True
strict = False
disallow_any_unimported = False

[mypy-ztb.training.*]
strict = True
warn_return_any = True
disallow_any_generics = True
disallow_incomplete_defs = True
disallow_any_unimported = False  # Allow unfollowed imports for external libs
disallow_any_expr = False
disallow_any_decorated = True
disallow_any_explicit = False
disallow_subclassing_any = True
warn_unreachable = True
strict_equality = True

[mypy-pydantic.*]
ignore_missing_imports = True

[mypy-psutil.*]
ignore_missing_imports = True

[mypy-requests.*]
ignore_missing_imports = True

[mypy-yaml.*]
ignore_missing_imports = True

[mypy-jsonschema.*]
ignore_missing_imports = True

[mypy-talib.*]
ignore_missing_imports = True

[mypy-ta.*]
ignore_missing_imports = True

[mypy-websockets.*]
ignore_missing_imports = True

[mypy-setuptools.*]
ignore_missing_imports = True

[mypy-ztb.contracts.*]
disallow_any_decorated = False

[mypy-ztb.utils.*]
disallow_any_decorated = False
ignore_missing_imports = True

[mypy-GPUtil.*]
ignore_missing_imports = True

[mypy-shap.*]
ignore_missing_imports = True

[mypy-cache.*]
ignore_missing_imports = True

[mypy-flask.*]
ignore_missing_imports = True

[mypy-ztb.*]
strict = True
warn_return_any = True
disallow_any_generics = True
disallow_incomplete_defs = True
disallow_any_unimported = True
disallow_any_expr = False
disallow_any_decorated = True
; Temporarily allow explicit Any for gradual migration
disallow_any_explicit = False
disallow_subclassing_any = True

[mypy-pandas]
ignore_errors = True

[mypy-torch.*]
ignore_missing_imports = True

[mypy-zstandard.*]
ignore_missing_imports = True

[mypy-lz4.*]
ignore_missing_imports = True

[mypy-prometheus_client.*]
ignore_missing_imports = True

[mypy-stable_baselines3.*]
ignore_missing_imports = True

[mypy-ztb.tests.*]
ignore_errors = True

[mypy-ztb.scripts.*]
ignore_missing_imports = True
ignore_errors = True

[mypy-ztb.utils.run_metadata]
ignore_errors = True

[mypy-ztb.trading.live.simulation.paper_trader]
ignore_errors = True

[mypy-ztb.training.unified_trainer]
ignore_errors = True

[mypy-ztb.training.ppo_trainer]
ignore_errors = True

[mypy-notifier.*]
ignore_missing_imports = True

[mypy-ztb.tools.*]
ignore_errors = True

[mypy-ztb.experiments.*]
ignore_errors = True

[mypy-ztb.utils.checkpoint]
ignore_errors = True

[mypy-ztb.trading.live.simulation.sim_broker]
ignore_errors = True

[mypy-ztb.features.trend.regime_clustering]
ignore_errors = True

[mypy-sklearn.*]
ignore_missing_imports = True

[mypy-pyarrow.*]
ignore_missing_imports = True

[mypy-apscheduler.*]
ignore_missing_imports = True

[mypy-tensorboard.*]
ignore_missing_imports = True

[mypy-pkg_resources]
ignore_missing_imports = True

[mypy-skopt.*]
ignore_missing_imports = True

[mypy-pynvml]
ignore_missing_imports = True

[mypy-live.*]
ignore_missing_imports = True