[mypy]
python_version = 3.11
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
disallow_untyped_decorators = True
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_no_return = True
warn_unreachable = True
strict_equality = True
show_error_codes = True
exclude = (?x)(
    # Exclude test files
    ztb/tests/.*
    | ztb/scripts/.*
    | ztb/.*test.*
    | ztb/.*_test.*
    | ztb/analysis/.*
    | ztb/ops/.*
    | ztb/training/.*
    | ztb/python/.*
    )

# Allow dynamic typing for third-party libraries
[mypy-requests.*]
ignore_missing_imports = True

[mypy-pandas.*]
ignore_missing_imports = True

[mypy-numpy.*]
ignore_missing_imports = True

[mypy-gymnasium.*]
ignore_missing_imports = True

[mypy-stable_baselines3.*]
ignore_missing_imports = True

[mypy-torch.*]
ignore_missing_imports = True

[mypy-pytest.*]
ignore_missing_imports = True

[mypy-dotenv.*]
ignore_missing_imports = True

[mypy-websockets.*]
ignore_missing_imports = True

[mypy-pydantic.*]
ignore_missing_imports = True

[mypy-psutil.*]
ignore_missing_imports = True

[mypy-scipy.*]
ignore_missing_imports = True

[mypy-sklearn.*]
ignore_missing_imports = True

[mypy-pyarrow.*]
ignore_missing_imports = True

[mypy-lz4.*]
ignore_missing_imports = True

[mypy-talib.*]
ignore_missing_imports = True

[mypy-ta.*]
ignore_missing_imports = True

[mypy-zstandard.*]
ignore_missing_imports = True

# Ignore test files for now
[mypy-tests.*]
ignore_errors = True

# Ignore scripts for now
[mypy-scripts.*]
ignore_errors = True