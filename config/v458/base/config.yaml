version: '4.5.8'
description: "v458 Lost Alpha Integration & Stabilization"

training:
  model_name: 'v458_lost_alpha_stabilization'
  algorithm: 'sac'
  total_timesteps: 10000  # Very short for quick validation
  seed: 123  # For stability testing

  sac_hyperparameters:
    seed: 123

  environment:
    initial_balance: 10000000.0  # 10M JPY for v458
    transaction_cost: 0.001  # 0.1%
    max_position_size: 1.0
    timeframe: "1m"
    min_delta: 0.01

    # v458 Specific Settings
    action_space_type: "2d_position"  # Continuous position + TTL
    guidance_decay_steps: 20000  # Curriculum learning decay (balanced)

    # Feature Configuration (inherited from v456)
    feature_config_path: "config/features/features.yaml"

    # Reward Settings (PnL + Trend Guidance with Decay)
    reward_scale: 100000.0  # Scale down rewards for learning

    reward_settings:
      # Basic PnL reward (inherited)
      hold_grace: 20
      hold_ramp: 50.0
      edge_penalty_rate: 1.0
      min_edge_mult: 1.5  # Increased for edge filtering
      vol_floor: 0.001  # Increased to reduce noise trades
      vol_floor_penalty: 20000000.0

      # Frequency control
      cooldown_steps: 30  # Minimum steps between trades

    # Execution Model (inherited from v457)
    execution_model:
      base_slippage: 0.0001
      atr_slippage_factor: 0.1
      base_latency_ms: 10.0
      latency_jitter_ms: 5.0

    # Dynamic Thresholds (inherited)
    dynamic_threshold_mode: "z_score"
    z_score_window: 50
    z_score_threshold: 3.0
    z_score_method: "mad"
    min_action_threshold: 0.001

  # SAC Hyperparameters (Conservative for Stability)
  sac_hyperparameters:
    gamma: 0.99  # Standard horizon
    ent_coef: "auto"  # Adaptive entropy
    learning_rate: 3.0e-4  # Standard
    batch_size: 256  # Standard
    buffer_size: 100000  # Standard
    learning_starts: 100
    tau: 0.005
    train_freq: 1
    gradient_steps: 1
    seed: 123

  # Seeds for reproducibility testing
  seeds: [42, 123, 777, 999]

logging:
  log_level: 'INFO'
  project: 'zaif-bot-v458'

# Data paths with OOS split (70/15/15)
data:
  source_data: "data/btc_jpy_1m_v451.csv"
  training_start: 0
  training_end: 98800  # ~70% of 141k
  validation_start: 98800
  validation_end: 119900  # ~15%
  test_start: 119900
  test_end: 141000  # ~15%