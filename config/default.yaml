version: '1.0'
training:
  model_name: 'default_model'
  algorithm: 'ppo'
  total_timesteps: 10000
  data_config:
    csv_path: null
    use_real_data: true
    data_path: null
    random_start: true
    min_samples: 10000
  environment:
    initial_balance: 200000.0
    transaction_cost: 1.0e-05
    max_position_size: 1.0
    enable_action_masking: true
    use_continuous_actions: true
    use_standardized_observations: true
    curriculum_stage: balanced_trading
    continuous_to_discrete_threshold: 0.1
    reward_settings:
      use_simple_reward: false
      reward_scale: 100.0
      trading_bonus: 0.01
      profit_bonuses: {}
      penalty_coefficients: {}
      entropy_bonus: 0.0
  features:
    features: {}
    feature_set: default
    adaptive_feature_selection: {}
  ppo_hyperparameters:
    learning_rate: 3.0e-04
    n_steps: 2048
    batch_size: 64
    n_epochs: 10
    gamma: 0.99
    gae_lambda: 0.95
    clip_range: 0.2
    ent_coef: 0.0
    vf_coef: 0.5
    max_grad_norm: 0.5
evaluation:
  thresholds:
    re_evaluate: 0.05
    monitor: 0.01
  min_samples: 10000
  risk_metrics:
  - sharpe
  - sortino
  - max_drawdown
  performance_metrics:
  - total_return
  - win_rate
  - profit_factor
deployment: null
logging:
  level: INFO
  format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
  file_path: null
features:
  features: {}
  feature_set: default
  adaptive_feature_selection: {}
