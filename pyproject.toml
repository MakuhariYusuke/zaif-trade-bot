[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zaif-trade-bot"
version = "4.2.0"
description = "Advanced trading bot with reinforcement learning"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "MakuhariYusuke", email = "makuhari@example.com"},
]
maintainers = [
    {name = "MakuhariYusuke", email = "makuhari@example.com"},
]
keywords = ["trading", "reinforcement-learning", "finance", "bitcoin", "algorithmic-trading"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.11"
dependencies = [
    # Core ML & RL
    "numpy>=1.24.4,<3.0",
    "pandas>=2.0.0,<3.0",
    "scikit-learn>=1.3.2,<2.0",
    "scipy>=1.10.0,<2.0",
    "torch>=2.0.0,<3.0",
    "torchvision>=0.15.0,<1.0",
    "torchaudio>=2.0.0,<3.0",
    "transformers>=4.0.0,<5.0",
    "datasets>=2.0.0,<3.0",
    "gymnasium>=0.28.1,<1.0",
    "stable-baselines3[extra]>=1.8.0,<2.0",
    "sb3-contrib>=1.8.0,<2.0",
    "optuna>=3.0.0,<4.0",
    "shap>=0.40.0,<1.0",

    # Config validation
    "pydantic>=2.0.0,<3.0",

    # Data processing
    "pyarrow>=12.0.0,<17.0",
    "matplotlib>=3.7.0,<4.0",
    "seaborn>=0.12.0,<1.0",
    "jupyterlab>=4.0.0,<5.0",
    "opencv-python>=4.8.0,<5.0",

    # Utilities
    "rich>=13.0.0,<14.0",
    "requests>=2.31.0,<3.0",
    "PyYAML>=6.0.1,<7.0",
    "APScheduler>=3.10.0,<4.0",
    "prometheus_client>=0.19.0,<1.0",
    "psutil>=5.9.0,<6.0",
    "pygame>=2.5.0,<3.0",
    "fredapi>=0.5.0,<1.0",
    "alpha-vantage>=2.3.0,<3.0",
    "newsapi-python>=0.2.0,<1.0",
    "yfinance>=0.2.0,<1.0",

    # Development & Testing
    "pytest>=8.0.0,<9.0",
    "pytest-cov>=4.0.0,<5.0",
    "black>=23.0.0,<24.0",
    "isort>=5.12.0,<6.0",
    "flake8>=6.0.0,<7.0",
    "mypy>=1.0.0,<2.0",
    "pre-commit>=3.0.0,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0,<8.0",
    "pytest-asyncio>=0.21.0,<1.0",
    "pytest-cov>=4.0.0,<5.0",
    "black>=23.0.0,<24.0",
    "isort>=5.12.0,<6.0",
    "flake8>=6.0.0,<7.0",
    "mypy>=1.0.0,<2.0",
    "pre-commit>=3.0.0,<4.0",
    "sphinx>=5.0.0,<6.0",
    "sphinx-rtd-theme>=1.2.0,<2.0",
]
docs = [
    "sphinx>=5.0.0,<6.0",
    "sphinx-rtd-theme>=1.2.0,<2.0",
    "myst-parser>=0.18.0,<1.0",
]

[project.urls]
Homepage = "https://github.com/MakuhariYusuke/zaif-trade-bot"
Repository = "https://github.com/MakuhariYusuke/zaif-trade-bot"
Issues = "https://github.com/MakuhariYusuke/zaif-trade-bot/issues"
Documentation = "https://zaif-trade-bot.readthedocs.io/"

[tool.setuptools]
packages = ["ztb"]
package-dir = {"" = "."}

[tool.setuptools.package-data]
ztb = ["py.typed"]

[tool.black]
line-length = 120
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 120
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true
exclude = [
    "ztb/tests/.*",
    "ztb/scripts/.*",
    "ztb/.*test.*",
    "ztb/.*_test.*",
    "ztb/analysis/.*",
    "ztb/ops/.*",
    "ztb/training/.*",
    "ztb/python/.*",
]

[[tool.mypy.overrides]]
module = [
    "gymnasium.*",
    "stable_baselines3.*",
    "optuna.*",
    "requests.*",
    "pandas.*",
    "numpy.*",
    "torch.*",
    "pytest.*",
    "dotenv.*",
    "websockets.*",
    "pydantic.*",
    "psutil.*",
    "scipy.*",
    "sklearn.*",
    "pyarrow.*",
    "lz4.*",
    "talib.*",
    "ta.*",
    "zstandard.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "tests.*",
    "scripts.*",
]
ignore_errors = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --cov=ztb --cov-report=html --cov-report=term-missing"
testpaths = [
    "tests",
]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.coverage.run]
source = ["ztb"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "setup.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
]
